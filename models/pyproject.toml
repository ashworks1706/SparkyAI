[project]
name = "sparky-models"
version = "0.1.0"
description = "Post-training, datasets, and evals for Sparky models"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "datasets>=3.0",
    "openai>=1.60",
    "huggingface-hub>=0.30",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.15",
    "trl>=0.19",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "unsloth>=2025.1; sys_platform == 'linux'",
    "wandb>=0.19",
]
eval = [
    "inspect-ai>=0.3",
    "lm-eval>=0.4",
]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
sparky-data = "sparky_models.datasets.cli:app"
sparky-train = "sparky_models.training.cli:app"
sparky-eval = "sparky_models.evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparky_models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
