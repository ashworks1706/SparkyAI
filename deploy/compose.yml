services:
  engine:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/engine"]
    env_file: ../.env
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_REDIS__URL: redis://redis:6379
      SPARKY_QDRANT__URL: http://qdrant:6334
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }
    restart: unless-stopped

  discord:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/discord"]
    env_file: ../.env
    environment:
      SPARKY_ENGINE__BASE_URL: http://engine:8080
    depends_on: [engine]
    restart: unless-stopped

  scraper:
    build: { context: .., dockerfile: deploy/docker/scraper.Dockerfile }
    env_file: ../.env
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_REDIS__URL: redis://redis:6379
      SPARKY_QDRANT__URL: http://qdrant:6334
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    restart: unless-stopped

  # Phase 7. Not started by default: `just up --profile sandbox`.
  sandbox:
    build: { context: .., dockerfile: deploy/docker/sandbox.Dockerfile }
    profiles: [sandbox]
    env_file: ../.env
    environment:
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
    expose: ["8090"]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: sparky
      POSTGRES_DB: sparky
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.15.0
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["6333:6333", "6334:6334"]

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
