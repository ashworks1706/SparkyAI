    logging: *posthog-logging
    environment:
      GRPC_ADDRESS: 0.0.0.0:50051
      PRIMARY_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      RUST_LOG: info
      METRICS_PORT: "9100"
    depends_on:
      posthog-db: { condition: service_healthy }
    networks: { posthog: { aliases: [personhog-replica] } }

  posthog-personhog-router:
    image: *posthog-personhog-router-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      GRPC_ADDRESS: 0.0.0.0:50052
      REPLICA_URL: http://personhog-replica:50051
      BACKEND_TIMEOUT_MS: "5000"
      RUST_LOG: info
      METRICS_PORT: "9101"
    depends_on: [posthog-personhog-replica]
    networks: { posthog: { aliases: [personhog-router] } }

  posthog-feature-flags:
    image: *posthog-feature-flags-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      REDIS_URL: redis://redis7:6379/
      ADDRESS: 0.0.0.0:3001
      RUST_LOG: info
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
    volumes:
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/share:/share
    depends_on: [posthog-db, posthog-redis7]
    networks: { posthog: { aliases: [feature-flags] } }

  posthog-hypercache-server:
    image: *posthog-hypercache-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_URL: redis://redis7:6379/
      ADDRESS: 0.0.0.0:3002
      RUST_LOG: info
    depends_on: [posthog-redis7]
    networks: { posthog: { aliases: [hypercache-server] } }

  posthog-cymbal:
    image: *posthog-cymbal-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      KAFKA_HOSTS: kafka:9092
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: any
      OBJECT_STORAGE_SECRET_ACCESS_KEY: any
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      BIND_HOST: 0.0.0.0
      BIND_PORT: "3302"
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_URL: postgres://posthog:posthog@db:5432/posthog
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      REDIS_URL: redis://redis7:6379/
      ISSUE_BUCKETS_REDIS_URL: redis://redis7:6379/
      RUST_LOG: info
      CYMBAL_REMOTE_RESOLUTION_HOST: cymbal-resolution
      INTERNAL_API_SECRET: *posthog-secret
    volumes:
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/share:/share
    depends_on:
      posthog-kafka-init: { condition: service_completed_successfully }
      posthog-seaweedfs: { condition: service_healthy }
      posthog-db: { condition: service_healthy }
      posthog-redis7: { condition: service_healthy }
      posthog-cymbal-resolution: { condition: service_started }
    networks: { posthog: { aliases: [cymbal] } }

  posthog-cymbal-resolution:
    image: *posthog-cymbal-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      CYMBAL_MODE: resolution
      GRPC_ADDRESS: 0.0.0.0:50061
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: any
      OBJECT_STORAGE_SECRET_ACCESS_KEY: any
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      INTERNAL_API_SECRET: *posthog-secret
      RUST_LOG: info
    depends_on:
      posthog-seaweedfs: { condition: service_healthy }
      posthog-db: { condition: service_healthy }
    networks: { posthog: { aliases: [cymbal-resolution] } }

networks:
  posthog: {}

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  firecrawldata:
  promdata:
  grafanadata:
  posthog-postgres-data:
  posthog-redis7-data:
  posthog-clickhouse-data:
  posthog-zookeeper-data:
  posthog-zookeeper-datalog:
  posthog-zookeeper-logs:
  posthog-kafka-data:
  posthog-redpanda-data:
  posthog-objectstorage:
  posthog-seaweedfs:
  posthog-elasticsearch-data:
  posthog-caddy-data:
  posthog-caddy-config:
