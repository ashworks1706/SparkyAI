services:
  engine:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/engine"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_REDIS__URL: redis://redis:6379
      SPARKY_MODEL__BASE_URL: http://chat:8000/v1
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
      # run_sandbox drives the sandboxd daemon, never the host runtime.
      DOCKER_HOST: tcp://sandboxd:2375
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sandboxd: { condition: service_started }
    restart: unless-stopped

  # The container runtime run_sandbox uses: a daemon of its own, so driving it is not driving
  # the host runtime. No host port, so it is reachable only from inside the compose network. It
  # needs egress to pull the sandbox image; the containers it starts get --network none.
  sandboxd:
    image: docker:27-dind
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes: [sandboxdata:/var/lib/docker]
    restart: unless-stopped

  discord:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/discord"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_ENGINE__BASE_URL: http://engine:8080
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
    depends_on: [engine]
    restart: unless-stopped

  scraper:
    build: { context: .., dockerfile: deploy/docker/scraper.Dockerfile }
    command: ["serve"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_FIRECRAWL__BASE_URL: http://firecrawl:3002
      SPARKY_SEARCH__BASE_URL: http://searxng:8080
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
      # The admin session captured by `just scraper login`, mounted read-only from the host.
      SPARKY_AUTH__STORAGE_STATE_PATH: /data/auth/admin_state.json
    volumes:
      - ${SPARKY_AUTH_STATE_DIR:-./.sparky/auth}:/data/auth:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # One llama-server per model. Started by just model.
  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_CHAT_GGUF:-Qwen/Qwen3-4B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Context size is total across slots: each parallel slot gets ctx-size / N.
      - --ctx-size
      - ${SPARKY_CHAT_CTX:-16384}
      - --parallel
      - ${SPARKY_CHAT_PARALLEL:-2}
      # 8-bit KV cache with flash attention; fits beside embed on 6 GB.
      - --cache-type-k
      - ${SPARKY_CHAT_KV_TYPE:-q8_0}
      - --cache-type-v
      - ${SPARKY_CHAT_KV_TYPE:-q8_0}
      - --flash-attn
      - "on"
      - --n-gpu-layers
      - ${SPARKY_CHAT_NGL:-99}
      - --jinja
      - --metrics
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - ${SPARKY_EMBED_CTX:-4096}
      - --parallel
      - ${SPARKY_EMBED_PARALLEL:-2}
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --n-gpu-layers
      - ${SPARKY_EMBED_NGL:-99}
      - --metrics
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  # Self-hosted metasearch for the scraper's web search. Started by just search.
  searxng:
    image: docker.io/searxng/searxng:2026.9.12-d4f00d15d
    profiles: [search]
    environment:
      SEARXNG_SECRET: ${SPARKY_SEARXNG_SECRET:-local-only-change-me-0000000000000000}
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:8888:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Self-hosted Firecrawl for scraper fetch and extract. No API key (USE_DB_AUTHENTICATION off).
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    profiles: [crawl]
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      # nuq-postgres initializes schema in the default postgres database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
      NUM_WORKERS_PER_QUEUE: 4
    ports: ["3002:3002"]
    depends_on: [firecrawl-redis, firecrawl-rabbitmq, firecrawl-playwright, firecrawl-postgres]
    restart: unless-stopped

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    profiles: [crawl]
    environment:
      PORT: 3000
    restart: unless-stopped

  firecrawl-redis:
    image: redis:7-alpine
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    profiles: [crawl]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
    volumes: [firecrawldata:/var/lib/postgresql/data]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: sparky
      POSTGRES_DB: sparky
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      retries: 10

  # Browse retrieval index and conversation tables on http://localhost:8081. Started by just db.
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: [db]
    environment:
      PGWEB_DATABASE_URL: postgres://sparky:sparky@postgres:5432/sparky?sslmode=disable
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  # Trace UI on http://localhost:6006 (loopback only). Started by just phoenix. No authentication.
  phoenix:
    image: arizephoenix/phoenix:version-20.11.0
    profiles: [phoenix]
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenixdata:/data]
    ports: ["127.0.0.1:6006:6006"]
    restart: unless-stopped

  # Metrics store from llama-server; query at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  # Dashboards over Prometheus on http://localhost:3000. Inference dashboard is provisioned.
  grafana:
    image: grafana/grafana:11.5.1
    profiles: [metrics]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SPARKY_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # GPU utilization and VRAM from nvidia-smi. Separate profile; needs a GPU.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    profiles: [gpu-metrics]
    # nvidia-smi runs under the utility capability from the nvidia runtime.
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports: ["127.0.0.1:9835:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu, utility] }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  firecrawldata:
  phoenixdata:
  promdata:
  sandboxdata:
  grafanadata: