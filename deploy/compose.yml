services:
  engine:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/engine"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_MODEL__BASE_URL: http://chat:8000/v1
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_TELEMETRY__OTLP_ENDPOINT: http://phoenix:4317
      SPARKY_MCP__PLAYWRIGHT_URL: http://playwright-mcp:8931/mcp
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  discord:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/discord"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_ENGINE__BASE_URL: http://engine:8080
      SPARKY_TELEMETRY__OTLP_ENDPOINT: http://phoenix:4317
    depends_on: [engine]
    restart: unless-stopped

  scraper:
    build: { context: .., dockerfile: deploy/docker/scraper.Dockerfile }
    command: ["schedule"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_FIRECRAWL__BASE_URL: http://firecrawl:3002
      SPARKY_TELEMETRY__OTLP_ENDPOINT: http://phoenix:4317
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Phase 7. Not started by default: `just up --profile sandbox`.
  sandbox:
    build: { context: .., dockerfile: deploy/docker/sandbox.Dockerfile }
    profiles: [sandbox]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
    expose: ["8090"]
    restart: unless-stopped

  # Model serving. Not started by default: `just model`. One llama-server per model.
  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_CHAT_GGUF:-Qwen/Qwen3-4B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - ${SPARKY_CHAT_CTX:-4096}
      - --n-gpu-layers
      - ${SPARKY_CHAT_NGL:-99}
      - --jinja
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - ${SPARKY_EMBED_CTX:-2048}
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --n-gpu-layers
      - ${SPARKY_EMBED_NGL:-99}
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  # Trace UI (Arize Phoenix). OTLP gRPC on 4317, UI on 6006. The engine exports here by default.
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenixdata:/data]
    ports: ["6006:6006", "4317:4317"]
    restart: unless-stopped

  # Firecrawl, self-hosted: the scraper's fetch + extract. Not started by default: `just crawl`.
  # No API key: USE_DB_AUTHENTICATION is off. Five containers, all internal except the API.
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    profiles: [crawl]
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      # nuq-postgres initialises its schema in the default `postgres` database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
      NUM_WORKERS_PER_QUEUE: 4
    ports: ["3002:3002"]
    depends_on: [firecrawl-redis, firecrawl-rabbitmq, firecrawl-playwright, firecrawl-postgres]
    restart: unless-stopped

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    profiles: [crawl]
    environment:
      PORT: 3000
    restart: unless-stopped

  firecrawl-redis:
    image: redis:7-alpine
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    profiles: [crawl]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
    volumes: [firecrawldata:/var/lib/postgresql/data]
    restart: unless-stopped

  # Playwright MCP: the browser as tools for the engine's own loop. Not started by default:
  # `just browser`. Headless, isolated profile, loopback-only port.
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    profiles: [browser]
    # The image entrypoint is already `node /app/cli.js --headless --browser chromium`.
    command: ["--isolated", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "localhost:8931,127.0.0.1:8931,playwright-mcp:8931"]
    init: true
    ports: ["127.0.0.1:8931:8931"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: sparky
      POSTGRES_DB: sparky
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  phoenixdata:
  firecrawldata:
