services:
  engine:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/engine"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_MODEL__BASE_URL: http://chat:8000/v1
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_RERANKER__BASE_URL: http://rerank:8002/v1
      SPARKY_TELEMETRY__OTLP_ENDPOINT: http://phoenix:4317
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  discord:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/discord"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_ENGINE__BASE_URL: http://engine:8080
    depends_on: [engine]
    restart: unless-stopped

  scraper:
    build: { context: .., dockerfile: deploy/docker/scraper.Dockerfile }
    command: ["schedule"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Phase 7. Not started by default: `just up --profile sandbox`.
  sandbox:
    build: { context: .., dockerfile: deploy/docker/sandbox.Dockerfile }
    profiles: [sandbox]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
    expose: ["8090"]
    restart: unless-stopped

  # Model serving. Not started by default: `just model`. One llama-server per model.
  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_CHAT_GGUF:-Qwen/Qwen3-4B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - ${SPARKY_CHAT_CTX:-4096}
      - --n-gpu-layers
      - ${SPARKY_CHAT_NGL:-99}
      - --jinja
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - ${SPARKY_EMBED_CTX:-2048}
      - --n-gpu-layers
      - ${SPARKY_EMBED_NGL:-99}
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8001:8001"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_RERANK_GGUF:-mradermacher/Qwen3-Reranker-0.6B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --reranking
      - --ctx-size
      - ${SPARKY_RERANK_CTX:-2048}
      - --n-gpu-layers
      - ${SPARKY_RERANK_NGL:-99}
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8002:8002"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  # Trace UI (Arize Phoenix). OTLP gRPC on 4317, UI on 6006. The engine exports here by default.
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenixdata:/data]
    ports: ["6006:6006", "4317:4317"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: sparky
      POSTGRES_DB: sparky
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  phoenixdata:
