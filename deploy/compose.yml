# PostHog images for the posthog profile; pinned here only.
x-posthog-images:
  app: &posthog-app-image posthog/posthog:6fe2b622617da1dc3b7a1cadae6e100729c861cb@sha256:2010612967fa6cdd030dcd1fef2d586103a4338890f621f084a5a731be4ca325
  node: &posthog-node-image posthog/posthog-node:latest@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
  capture: &posthog-capture-image ghcr.io/posthog/posthog/capture:master@sha256:9b166761f1e282880a76fb4f3e66afad9ba954fe383581dc5e0074a729c5c99e
  capture-logs: &posthog-capture-logs-image ghcr.io/posthog/posthog/capture-logs:master@sha256:cd328b86a9e04f168fcbaef1d3bddf8f8a5c1f5ca2527231f7bf2946c459e833
  personhog-replica: &posthog-personhog-replica-image ghcr.io/posthog/posthog/personhog-replica:master@sha256:b4a9dd4e5a25e90fd2c2d3e7e0adbf807b10c28f834cb719c22da67b74e64dbe
  personhog-router: &posthog-personhog-router-image ghcr.io/posthog/posthog/personhog-router:master@sha256:437c4b698ae32614ce5e7b106f6f7555a08e765442dcce545514a1c371126754
  caddy: &posthog-caddy-image caddy:latest@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017

# PostHog secrets. The defaults are for a loopback-only local stack; set real values in .env.
x-posthog-secrets:
  secret: &posthog-secret ${SPARKY_POSTHOG_SECRET:-posthog-local-only-change-me-000000000000000000000000}
  salt: &posthog-salt ${SPARKY_POSTHOG_ENCRYPTION_SALT_KEYS:-localonlychangeme000000000000000}
  site-url: &posthog-site-url ${SPARKY_POSTHOG_SITE_URL:-http://localhost:8010}

x-posthog-logging: &posthog-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Environment shared by the Django services: web and worker.
x-posthog-django-env: &posthog-django-env
  DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
  PGHOST: db
  PGUSER: posthog
  PGPASSWORD: posthog
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_DATABASE: posthog
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_VERIFY: "false"
  CLICKHOUSE_API_USER: api
  CLICKHOUSE_API_PASSWORD: apipass
  CLICKHOUSE_APP_USER: app
  CLICKHOUSE_APP_PASSWORD: apppass
  CLICKHOUSE_BILLING_USER: billing
  CLICKHOUSE_BILLING_PASSWORD: billingpass
  CLICKHOUSE_DICT_READER_USER: dict_reader
  CLICKHOUSE_DICT_READER_PASSWORD: dictreaderpass
  REDIS_URL: redis://redis7:6379/
  KAFKA_HOSTS: kafka
  OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
  OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
  OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  OTEL_SDK_DISABLED: "true"
  API_QUERIES_PER_TEAM: '{"1": 100}'
  DEPLOYMENT: hobby
  PERSONS_DB_WRITER_URL: postgres://posthog:posthog@db:5432/posthog
  PERSONS_DB_READER_URL: postgres://posthog:posthog@db:5432/posthog
  SITE_URL: *posthog-site-url
  SECRET_KEY: *posthog-secret
  # Plain http on loopback behind the proxy: no secure cookies, no https redirect.
  IS_BEHIND_PROXY: "true"
  TRUST_ALL_PROXIES: "true"
  DISABLE_SECURE_SSL_REDIRECT: "true"
  SECURE_COOKIES: "false"

services:
  engine:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/engine"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_REDIS__URL: redis://redis:6379
      SPARKY_MODEL__BASE_URL: http://chat:8000/v1
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_TELEMETRY__HOST: http://posthog
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  discord:
    build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
    entrypoint: ["/discord"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_ENGINE__BASE_URL: http://engine:8080
      SPARKY_TELEMETRY__HOST: http://posthog
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
    depends_on: [engine]
    restart: unless-stopped

  scraper:
    build: { context: .., dockerfile: deploy/docker/scraper.Dockerfile }
    command: ["serve"]
    env_file:
      - { path: ../.env, required: false }
    environment:
      SPARKY_POSTGRES__URL: postgres://sparky:sparky@postgres:5432/sparky
      SPARKY_OBJECT_STORE__ENDPOINT: http://minio:9000
      SPARKY_EMBEDDING__BASE_URL: http://embed:8001/v1
      SPARKY_FIRECRAWL__BASE_URL: http://firecrawl:3002
      SPARKY_SEARCH__BASE_URL: http://searxng:8080
      SPARKY_TELEMETRY__HOST: http://posthog
      SPARKY_TELEMETRY__PHOENIX_URL: ${SPARKY_PHOENIX_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # One llama-server per model. Started by just model.
  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_CHAT_GGUF:-Qwen/Qwen3-4B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Context size is total across slots: each parallel slot gets ctx-size / N.
      - --ctx-size
      - ${SPARKY_CHAT_CTX:-16384}
      - --parallel
      - ${SPARKY_CHAT_PARALLEL:-2}
      # 8-bit KV cache with flash attention; fits beside embed on 6 GB.
      - --cache-type-k
      - ${SPARKY_CHAT_KV_TYPE:-q8_0}
      - --cache-type-v
      - ${SPARKY_CHAT_KV_TYPE:-q8_0}
      - --flash-attn
      - "on"
      - --n-gpu-layers
      - ${SPARKY_CHAT_NGL:-99}
      - --jinja
      - --metrics
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${SPARKY_EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - ${SPARKY_EMBED_CTX:-4096}
      - --parallel
      - ${SPARKY_EMBED_PARALLEL:-2}
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --n-gpu-layers
      - ${SPARKY_EMBED_NGL:-99}
      - --metrics
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  # Self-hosted metasearch for the scraper's web search. Started by just search.
  searxng:
    image: docker.io/searxng/searxng:2026.9.12-d4f00d15d
    profiles: [search]
    environment:
      SEARXNG_SECRET: ${SPARKY_SEARXNG_SECRET:-local-only-change-me-0000000000000000}
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:8888:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Self-hosted Firecrawl for scraper fetch and extract. No API key (USE_DB_AUTHENTICATION off).
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    profiles: [crawl]
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      # nuq-postgres initializes schema in the default postgres database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
      NUM_WORKERS_PER_QUEUE: 4
    ports: ["3002:3002"]
    depends_on: [firecrawl-redis, firecrawl-rabbitmq, firecrawl-playwright, firecrawl-postgres]
    restart: unless-stopped

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    profiles: [crawl]
    environment:
      PORT: 3000
    restart: unless-stopped

  firecrawl-redis:
    image: redis:7-alpine
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    profiles: [crawl]
    restart: unless-stopped

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    profiles: [crawl]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPARKY_FIRECRAWL_DB_PASSWORD:-firecrawl-local-only-change-me-32chars}
      POSTGRES_DB: postgres
    volumes: [firecrawldata:/var/lib/postgresql/data]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: sparky
      POSTGRES_DB: sparky
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      retries: 10

  # Browse retrieval index and conversation tables on http://localhost:8081. Started by just db.
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: [db]
    environment:
      PGWEB_DATABASE_URL: postgres://sparky:sparky@postgres:5432/sparky?sslmode=disable
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  # Trace UI on http://localhost:6006 (loopback only). Started by just phoenix. No authentication.
  phoenix:
    image: arizephoenix/phoenix:version-20.11.0
    profiles: [phoenix]
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenixdata:/data]
    ports: ["127.0.0.1:6006:6006"]
    restart: unless-stopped

  # Metrics store from llama-server; query at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  # Dashboards over Prometheus on http://localhost:3000. Inference dashboard is provisioned.
  grafana:
    image: grafana/grafana:11.5.1
    profiles: [metrics]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SPARKY_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # GPU utilization and VRAM from nvidia-smi. Separate profile; needs a GPU.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    profiles: [gpu-metrics]
    # nvidia-smi runs under the utility capability from the nvidia runtime.
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports: ["127.0.0.1:9835:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu, utility] }
    restart: unless-stopped

  # PostHog proxy: UI and ingestion on port 80, the only service on the default network.
  posthog:
    image: *posthog-caddy-image
    profiles: [posthog]
    entrypoint: sh
    command: -c 'set -x && echo "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
    restart: always
    logging: *posthog-logging
    environment:
      CADDYFILE: |
        {
        }
        http:// {

            @capture {
                path /e
                path /e/
                path /e/*
                path /i/v0
                path /i/v0/
                path /i/v0/*
                path /i/v1/analytics/events
                path /i/v1/analytics/events/
                path /batch
                path /batch/
                path /batch/*
                path /capture
                path /capture/
                path /capture/*
            }

            @capture-logs {
                path /i/v1/logs
                path /i/v1/logs/
                path /i/v1/logs/*
                path /i/v1/traces
                path /i/v1/traces/
                path /i/v1/traces/*
                path /i/v1/metrics
                path /i/v1/metrics/
                path /i/v1/metrics/*
            }

            handle @capture {
                reverse_proxy capture:3000
            }

            handle @capture-logs {
                reverse_proxy capture-logs:4318
            }

            @objectstorage {
                path /posthog
                path /posthog/
                path /posthog/*
            }

            handle @objectstorage {
                reverse_proxy objectstorage:19000
            }

            handle {
                reverse_proxy web:8000
            }
        }
    ports: ["127.0.0.1:8010:80"]
    volumes:
      - posthog-caddy-data:/data
      - posthog-caddy-config:/config
    networks:
      default: {}
      posthog: { aliases: [proxy] }
    # Starting proxy starts all dependent services.
    depends_on:
      - posthog-web
      - posthog-worker
      - posthog-capture
      - posthog-capture-logs
      - posthog-ingestion-general
      - posthog-ingestion-traces

  posthog-db:
    image: postgres:15.12-alpine
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    volumes: [posthog-postgres-data:/var/lib/postgresql/data]
    networks: { posthog: { aliases: [db] } }

  posthog-redis7:
    image: redis:7.2-alpine
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes: [posthog-redis7-data:/data]
    networks: { posthog: { aliases: [redis7] } }

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:26.6.2.158
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/posthog/idl:/idl
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/posthog/user_scripts:/var/lib/clickhouse/user_scripts
      - posthog-clickhouse-data:/var/lib/clickhouse
    depends_on: [posthog-kafka, posthog-zookeeper]
    networks: { posthog: { aliases: [clickhouse] } }

  posthog-zookeeper:
    image: zookeeper:3.7.0
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
    volumes:
      - posthog-zookeeper-datalog:/datalog
      - posthog-zookeeper-data:/data
      - posthog-zookeeper-logs:/logs
    networks: { posthog: { aliases: [zookeeper] } }

  posthog-kafka:
    image: docker.io/redpandadata/redpanda:v25.1.9
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    environment:
      ALLOW_PLAINTEXT_LISTENER: "true"
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - posthog-redpanda-data:/var/lib/redpanda/data
      - posthog-kafka-data:/bitnami/kafka
    depends_on: [posthog-zookeeper]
    networks: { posthog: { aliases: [kafka] } }

  posthog-kafka-init:
    image: docker.io/redpandadata/redpanda:v25.1.9
    profiles: [posthog]
    logging: *posthog-logging
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        echo "Waiting for Kafka broker to accept connections..."
        TIMEOUT=60
        ELAPSED=0
        until rpk topic list --brokers kafka:9092 2>/dev/null; do
            echo "Kafka broker not ready yet (elapsed: $${ELAPSED}s)..."
            sleep 2
            ELAPSED=$$((ELAPSED + 2))
            if [ $$ELAPSED -ge $$TIMEOUT ]; then
                echo "Timeout waiting for Kafka broker after $${TIMEOUT}s"
                echo "Final attempt to list topics:"
                rpk topic list --brokers kafka:9092 || true
                exit 1
            fi
        done
        echo "Kafka broker is accepting requests, creating topics..."
        TOPICS=$$(grep -vE '^[[:space:]]*#|^[[:space:]]*$$' /topics.txt)
        for topic in $$TOPICS; do
            if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                echo "Topic $$topic created successfully"
            else
                if rpk topic list --brokers kafka:9092 | awk '{print $$1}' | grep -qx "$$topic"; then
                    echo "Topic $$topic already exists, continuing"
                else
                    echo "Failed to create topic $$topic"
                    exit 1
                fi
            fi
        done
        echo "Final topic list:"
        rpk topic list --brokers kafka:9092
        echo "Topics ready"
    volumes:
      - ${SPARKY_POSTHOG_DIR:-../.sparky/posthog}/src/docker/kafka/topics.txt:/topics.txt:ro
    depends_on:
      posthog-kafka: { condition: service_healthy }
    networks: { posthog: { aliases: [kafka-init] } }

  posthog-objectstorage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
    volumes: [posthog-objectstorage:/data]
    networks: { posthog: { aliases: [objectstorage] } }

  posthog-seaweedfs:
    image: chrislusf/seaweedfs:4.29
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/weed "$$@" &
        WEED_PID=$$!
        echo "Waiting for SeaweedFS to initialize..."
        while true; do
            sleep 5
            echo "Checking if posthog bucket exists..."
            if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q "posthog"; then
                echo "Bucket posthog exists!"
                break
            fi
            echo "Bucket not found, attempting to create..."
            echo "s3.bucket.create -name posthog" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
            echo "Retrying in 5s..."
        done
        echo "SeaweedFS ready with posthog bucket"
        wait $$WEED_PID
      - --
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-volume.max=1000"]
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes: [posthog-seaweedfs:/data]
    networks: { posthog: { aliases: [seaweedfs] } }

  posthog-web:
    image: *posthog-app-image
    profiles: [posthog]
    command: /compose/start
    restart: on-failure
    logging: *posthog-logging
    environment:
      <<: *posthog-django-env
      OBJECT_STORAGE_PUBLIC_ENDPOINT: *posthog-site-url
      OBJECT_STORAGE_ENABLED: "true"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: any
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: any
      SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
      INTERNAL_API_SECRET: *posthog-secret
      ENCRYPTION_SALT_KEYS: *posthog-salt
      OTEL_SERVICE_NAME: posthog
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OPT_OUT_CAPTURE: "true"
      CSP_REPORT_ENDPOINT: ""
      PERSONHOG_ADDR: personhog-router:50052
      PERSONHOG_ENABLED: "true"
      CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
      CLICKHOUSE_LOGS_CLUSTER_SECURE: "false"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes: [./posthog/compose:/compose]
    depends_on:
      - posthog-db
      - posthog-redis7
      - posthog-clickhouse
      - posthog-kafka
      - posthog-objectstorage
      - posthog-seaweedfs
      - posthog-personhog-router
    networks: { posthog: { aliases: [web] } }

  posthog-worker:
    image: *posthog-app-image
    profiles: [posthog]
    command: ./bin/docker-worker-celery --with-scheduler
    restart: on-failure
    logging: *posthog-logging
    environment:
      <<: *posthog-django-env
      OBJECT_STORAGE_PUBLIC_ENDPOINT: *posthog-site-url
      OBJECT_STORAGE_ENABLED: "true"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: any
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: any
      SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
      INTERNAL_API_SECRET: *posthog-secret
      ENCRYPTION_SALT_KEYS: *posthog-salt
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: personhog-router:50052
      PERSONHOG_ENABLED: "true"
      CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
      CLICKHOUSE_LOGS_CLUSTER_SECURE: "false"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    depends_on:
      posthog-db: { condition: service_healthy }
      posthog-redis7: { condition: service_healthy }
      posthog-clickhouse: { condition: service_started }
      posthog-kafka: { condition: service_healthy }
      posthog-web: { condition: service_started }
      posthog-personhog-router: { condition: service_started }
    networks: { posthog: { aliases: [worker] } }

  posthog-ingestion-general:
    image: *posthog-node-image
    profiles: [posthog]
    command: node nodejs/dist/index.js
    restart: on-failure
    logging: *posthog-logging
    environment:
      PLUGIN_SERVER_MODE: ingestion-v2-combined
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
      CDP_REDIS_HOST: redis7
      ENCRYPTION_SALT_KEYS: *posthog-salt
      AI_BLOB_S3_BUCKET: ai-blobs
      AI_BLOB_S3_PREFIX: aio/
      AI_BLOB_S3_ENDPOINT: http://objectstorage:19000
      AI_BLOB_S3_REGION: us-east-1
      AI_BLOB_S3_ACCESS_KEY_ID: object_storage_root_user
      AI_BLOB_S3_SECRET_ACCESS_KEY: object_storage_root_password
      AI_BLOB_OFFLOAD_TEAMS: "*"
      PERSONHOG_ADDR: personhog-router:50052
      PERSONHOG_ENABLED: "true"
    depends_on:
      - posthog-db
      - posthog-redis7
      - posthog-clickhouse
      - posthog-kafka
      - posthog-objectstorage
      - posthog-personhog-router
    networks: { posthog: { aliases: [ingestion-general] } }

  posthog-ingestion-traces:
    image: *posthog-node-image
    profiles: [posthog]
    command: node nodejs/dist/index.js
    restart: on-failure
    logging: *posthog-logging
    environment:
      PLUGIN_SERVER_MODE: ingestion-traces
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      TRACES_REDIS_HOST: redis7
      TRACES_REDIS_TLS: "false"
    depends_on: [posthog-db, posthog-redis7, posthog-kafka]
    networks: { posthog: { aliases: [ingestion-traces] } }

  posthog-capture:
    image: *posthog-capture-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: events_plugin_ingestion
      KAFKA_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      CAPTURE_MODE: events
      RUST_LOG: info,rdkafka=warn
      CAPTURE_V1_SINKS: msk
      CAPTURE_V1_SINK_MSK_KAFKA_HOSTS: kafka:9092
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN: events_plugin_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL: events_plugin_ingestion_historical
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW: events_plugin_ingestion_overflow
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ: events_plugin_ingestion_dlq
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION: ingestion-errortracking-main
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP: heatmaps_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING: ingestion-clientwarnings-main-1
    networks: { posthog: { aliases: [capture] } }

  posthog-capture-logs:
    image: *posthog-capture-logs-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "4318"
      RUST_LOG: info,rdkafka=warn
      RUST_BACKTRACE: "1"
      KAFKA_HOSTS: kafka:9092
      JWT_SECRET: <randomly generated secret key>
      KAFKA_TOPIC: logs_ingestion
      KAFKA_METRICS_TOPIC: metrics_ingestion
    networks: { posthog: { aliases: [capture-logs] } }

  posthog-personhog-replica:
    image: *posthog-personhog-replica-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      GRPC_ADDRESS: 0.0.0.0:50051
      PRIMARY_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      RUST_LOG: info
      METRICS_PORT: "9100"
    depends_on:
      posthog-db: { condition: service_healthy }
    networks: { posthog: { aliases: [personhog-replica] } }

  posthog-personhog-router:
    image: *posthog-personhog-router-image
    profiles: [posthog]
    restart: on-failure
    logging: *posthog-logging
    environment:
      GRPC_ADDRESS: 0.0.0.0:50052
      REPLICA_URL: http://personhog-replica:50051
      BACKEND_TIMEOUT_MS: "5000"
      RUST_LOG: info
      METRICS_PORT: "9101"
    depends_on: [posthog-personhog-replica]
    networks: { posthog: { aliases: [personhog-router] } }

networks:
  posthog: {}

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  firecrawldata:
  phoenixdata:
  promdata:
  grafanadata:
  posthog-postgres-data:
  posthog-redis7-data:
  posthog-clickhouse-data:
  posthog-zookeeper-data:
  posthog-zookeeper-datalog:
  posthog-zookeeper-logs:
  posthog-kafka-data:
  posthog-redpanda-data:
  posthog-objectstorage:
  posthog-seaweedfs:
  posthog-caddy-data:
  posthog-caddy-config:
