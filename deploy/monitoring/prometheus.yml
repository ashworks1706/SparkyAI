# Scrapes llama-server metrics; targets from stopped profiles show as down.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: chat
    static_configs:
      - targets: ["chat:8000"]
  - job_name: embed
    static_configs:
      - targets: ["embed:8001"]
  # Only up under gpu-metrics profile.
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
