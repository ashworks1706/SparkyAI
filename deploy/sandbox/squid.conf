# Egress proxy for run_sandbox. Public HTTP and HTTPS only; nothing is cached.

http_port 3128

acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

# Private, loopback, link-local, carrier NAT, multicast and reserved ranges.
acl internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl internal dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl internal dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl internal dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny internal
http_access deny manager
http_access allow all

cache deny all
pinger_enable off
cache_mem 0 MB
forwarded_for delete
via off

pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
