; Every Sparky service in the RunPod pod: the two models, the engine and the bot. Logs go to the
; container log, which RunPod shows. With SPARKY_POD_ROLE=models start.sh sets SPARKY_RUN_APPS=false
; and only the models run.
; With SPARKY_MODELS_API_KEY set, both model servers listen on every interface and require that key.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:chat]
command=sh -c '/app/llama-server -hf %(ENV_SPARKY_CHAT_GGUF)s --host $SPARKY_MODELS_HOST --port 8000 ${SPARKY_MODELS_API_KEY:+--api-key $SPARKY_MODELS_API_KEY} --ctx-size %(ENV_SPARKY_CHAT_CTX)s --parallel %(ENV_SPARKY_CHAT_PARALLEL)s --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on --n-gpu-layers 99 --jinja --metrics || { sleep 30; exit 1; }'
directory=/app
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:embed]
command=sh -c '/app/llama-server -hf %(ENV_SPARKY_EMBED_GGUF)s --host $SPARKY_MODELS_HOST --port 8001 ${SPARKY_MODELS_API_KEY:+--api-key $SPARKY_MODELS_API_KEY} --embeddings --pooling last --ctx-size %(ENV_SPARKY_EMBED_CTX)s --parallel %(ENV_SPARKY_EMBED_PARALLEL)s --batch-size 1024 --ubatch-size 1024 --n-gpu-layers 99 --metrics || { sleep 30; exit 1; }'
directory=/app
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:engine]
autostart=%(ENV_SPARKY_RUN_APPS)s
command=/usr/local/bin/engine
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:discord]
autostart=%(ENV_SPARKY_RUN_APPS)s
command=/usr/local/bin/discord
priority=50
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
