; Every Sparky service in the RunPod pod. Logs go to the container log, which RunPod shows.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_SPARKY_DATA_DIR)s/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --dir %(ENV_SPARKY_DATA_DIR)s/redis --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=/usr/local/bin/minio server %(ENV_SPARKY_DATA_DIR)s/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=MINIO_ROOT_USER="%(ENV_SPARKY_OBJECT_STORE__ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_SPARKY_OBJECT_STORE__SECRET_KEY)s"
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chat]
command=/app/llama-server -hf %(ENV_SPARKY_CHAT_GGUF)s --host 127.0.0.1 --port 8000 --ctx-size %(ENV_SPARKY_CHAT_CTX)s --parallel %(ENV_SPARKY_CHAT_PARALLEL)s --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on --n-gpu-layers 99 --jinja --metrics
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:embed]
command=/app/llama-server -hf %(ENV_SPARKY_EMBED_GGUF)s --host 127.0.0.1 --port 8001 --embeddings --pooling last --ctx-size %(ENV_SPARKY_EMBED_CTX)s --parallel %(ENV_SPARKY_EMBED_PARALLEL)s --batch-size 1024 --ubatch-size 1024 --n-gpu-layers 99 --metrics
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:searxng]
command=/opt/searxng/.venv/bin/python -m searx.webapp
directory=/opt/searxng
environment=PYTHONPATH="/opt/searxng",SEARXNG_BIND_ADDRESS="127.0.0.1",SEARXNG_PORT="8888"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Exits once the schema is current; restarts until Postgres accepts connections.
[program:migrate]
command=/opt/scraper/.venv/bin/scraper migrate
priority=30
startsecs=0
startretries=30
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:engine]
command=/usr/local/bin/engine
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scraper]
command=/opt/scraper/.venv/bin/scraper serve
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:discord]
command=/usr/local/bin/discord
priority=50
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup]
command=/usr/local/bin/sparky-backup
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
