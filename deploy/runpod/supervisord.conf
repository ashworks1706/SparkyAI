; Every Sparky service in the RunPod pod. Logs go to the container log, which RunPod shows.
; In platform mode start.sh sets SPARKY_STANDALONE_SERVICES=false and only the models, engine and bot run.
; With SPARKY_POD_ROLE=models it also sets SPARKY_RUN_APPS=false and only the models run.
; With SPARKY_MODELS_API_KEY set, both model servers listen on every interface and require that key.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_SPARKY_DATA_DIR)s/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=redis-server --bind 127.0.0.1 --dir %(ENV_SPARKY_DATA_DIR)s/redis --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/usr/local/bin/minio server %(ENV_SPARKY_DATA_DIR)s/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=MINIO_ROOT_USER="%(ENV_SPARKY_OBJECT_STORE__ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_SPARKY_OBJECT_STORE__SECRET_KEY)s"
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; A failed start waits 30s, which keeps a model download from hammering the Hub.
[program:chat]
command=sh -c '/app/llama-server -hf %(ENV_SPARKY_CHAT_GGUF)s --host $SPARKY_MODELS_HOST --port 8000 ${SPARKY_MODELS_API_KEY:+--api-key $SPARKY_MODELS_API_KEY} --ctx-size %(ENV_SPARKY_CHAT_CTX)s --parallel %(ENV_SPARKY_CHAT_PARALLEL)s --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on --n-gpu-layers 99 --jinja --metrics || { sleep 30; exit 1; }'
directory=/app
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:embed]
command=sh -c '/app/llama-server -hf %(ENV_SPARKY_EMBED_GGUF)s --host $SPARKY_MODELS_HOST --port 8001 ${SPARKY_MODELS_API_KEY:+--api-key $SPARKY_MODELS_API_KEY} --embeddings --pooling last --ctx-size %(ENV_SPARKY_EMBED_CTX)s --parallel %(ENV_SPARKY_EMBED_PARALLEL)s --batch-size 1024 --ubatch-size 1024 --n-gpu-layers 99 --metrics || { sleep 30; exit 1; }'
directory=/app
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:searxng]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/opt/searxng/.venv/bin/python -m searx.webapp
directory=/opt/searxng
environment=PYTHONPATH="/opt/searxng",SEARXNG_BIND_ADDRESS="127.0.0.1",SEARXNG_PORT="8888"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Exits once the schema is current; restarts until Postgres accepts connections.
[program:migrate]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/opt/scraper/.venv/bin/scraper migrate
priority=30
startsecs=0
startretries=30
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:engine]
autostart=%(ENV_SPARKY_RUN_APPS)s
command=/usr/local/bin/engine
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scraper]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/opt/scraper/.venv/bin/scraper serve
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:discord]
autostart=%(ENV_SPARKY_RUN_APPS)s
command=/usr/local/bin/discord
priority=50
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup]
autostart=%(ENV_SPARKY_STANDALONE_SERVICES)s
command=/usr/local/bin/sparky-backup
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
