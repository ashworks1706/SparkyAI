# Production override: GHCR images, no builds, only the engine port published.
services:
  engine:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
    environment:
      # The engine refuses to boot without its sandbox.
      SPARKY_SANDBOX__REQUIRED: "true"
  discord:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
  scraper:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-scraper:${SPARKY_IMAGE_TAG:-main}
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  # Phoenix has no authentication and is reached over a tunnel.
  phoenix:
    ports: !reset []
