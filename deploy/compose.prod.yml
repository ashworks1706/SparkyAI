# Production override: GHCR images, no builds, only the engine port published.
services:
  engine:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
    environment:
      # A production engine without its sandbox is a fault, not a degraded mode.
      SPARKY_SANDBOX__REQUIRED: "true"
  discord:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
  scraper:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-scraper:${SPARKY_IMAGE_TAG:-main}
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  # Phoenix holds full prompts and replies and has no authentication. Reach it over a tunnel.
  phoenix:
    ports: !reset []
