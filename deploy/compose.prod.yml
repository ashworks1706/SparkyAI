# Production override: prebuilt images from GHCR, no build, no host ports except engine.
# Usage: docker compose -f deploy/compose.yml -f deploy/compose.prod.yml up -d
services:
  engine:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
  discord:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-rust:${SPARKY_IMAGE_TAG:-main}
  scraper:
    build: !reset null
    image: ghcr.io/ashworks1706/sparkyai-scraper:${SPARKY_IMAGE_TAG:-main}
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  # Phoenix holds full prompts and replies and has no authentication. Reach it over a tunnel.
  phoenix:
    ports: !reset []
