# SearXNG for the scraper web search; unset values keep upstream defaults.
use_default_settings: true

general:
  instance_name: sparky-search

server:
  # Overridden by SEARXNG_SECRET.
  secret_key: "local-only-change-me"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json
