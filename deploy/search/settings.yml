# SearXNG for scraper web search; unset values keep upstream defaults. Scraper-only access.
use_default_settings: true

general:
  instance_name: sparky-search

server:
  # Overwritten by SEARXNG_SECRET from the environment.
  secret_key: "local-only-change-me"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json
