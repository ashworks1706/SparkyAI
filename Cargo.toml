[workspace]
resolver = "2"
members = ["crates/*", "apps/api", "apps/discord"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ashworks1706/SparkyAI"

[workspace.dependencies]
# core
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }

# llm / agents
rig-core = "0.42"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client"] }

# interfaces
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors", "timeout"] }

# storage
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
qdrant-client = "1.19"

# http client (discord → api)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# config
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "tls-ring"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.49"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
