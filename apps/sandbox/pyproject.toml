[project]
name = "sandbox"
version = "0.1.0"
description = "Sandbox: isolated browser worker for user-consented tasks; called by the engine"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "cryptography>=44",
    "structlog>=25",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]

[project.scripts]
sandbox = "sandbox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
