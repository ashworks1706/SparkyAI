[project]
name = "training"
version = "0.1.0"
description = "Training: dataset export from traces, engine evals with a baseline gate, SFT with GGUF export"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.15",
    "trl>=0.19",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "unsloth>=2025.1; sys_platform == 'linux'",
    "tensorboard>=2.17",
]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
data = "training.datasets.cli:app"
train = "training.posttrain.cli:app"
eval = "training.evals.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "training" = "." }
packages = [
    "training",
    "training.core",
    "training.datasets",
    "training.evals",
    "training.evals.suites",
    "training.posttrain",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
