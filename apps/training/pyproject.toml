[project]
name = "training"
version = "0.1.0"
description = "Training: datasets, post-training, and evals for Sparky models"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "datasets>=3.0",
    "openai>=1.60",
    "huggingface-hub>=0.30",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.15",
    "trl>=0.19",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "unsloth>=2025.1; sys_platform == 'linux'",
    "wandb>=0.19",
]
eval = [
    "inspect-ai>=0.3",
    "lm-eval>=0.4",
]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
data = "training.datasets.cli:app"
train = "training.posttrain.cli:app"
eval = "training.evals.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "training" = "." }
packages = [
    "training",
    "training.datasets",
    "training.evals",
    "training.evals.suites",
    "training.posttrain",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
