[project]
name = "evals"
version = "0.1.0"
description = "Engine evals with a baseline gate"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "httpx>=0.28.1",
    "typer>=0.27.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.17.1", "pytest>=9.1.1"]

[project.scripts]
eval = "evals.cli:app"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "evals" = "." }
packages = [
    "evals",
    "evals.core",
    "evals.suites",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
