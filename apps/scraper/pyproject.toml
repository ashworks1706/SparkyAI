[project]
name = "scraper"
version = "0.1.0"
description = "Scraper: fetch ASU sources offline, chunk, embed, and write the retrieval index"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.36",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "playwright>=1.50",
    "structlog>=25",
    "tenacity>=9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "scraper" = "." }
packages = [
    "scraper",
    "scraper.core",
    "scraper.sources",
    "scraper.store",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
asyncio_mode = "auto"
