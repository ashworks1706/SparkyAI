[project]
name = "scraper"
version = "0.1.0"
description = "Scraper: offline worker that keeps the knowledge index fresh"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "playwright>=1.50",
    "psycopg[binary,pool]>=3.2",
    "qdrant-client>=1.13",
    "boto3>=1.36",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "structlog>=25",
    "tenacity>=9",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8", "respx>=0.22"]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
