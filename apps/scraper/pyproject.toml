[project]
name = "scraper"
version = "0.1.0"
description = "Scraper: fetch ASU sources offline, chunk, embed, and write the retrieval index"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "boto3>=1.43.98",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "playwright>=1.63.0",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.16.8", "pytest>=9.1.1"]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "scraper" = "." }
packages = [
    "scraper",
    "scraper.core",
    "scraper.ingest",
    "scraper.ingest.drivers",
    "scraper.query",
    "scraper.query.sources",
    "scraper.sources",
    "scraper.store",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
