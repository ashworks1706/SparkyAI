[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge: owns every store — search, index, memory, conversations, sources — and the scraper that feeds them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "qdrant-client>=1.13",
    "redis>=5.2",
    "boto3>=1.36",
    "openai>=1.60",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "playwright>=1.50",
    "structlog>=25",
    "tenacity>=9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]

[project.scripts]
knowledge-api = "knowledge.api.main:run"
knowledge-scraper = "knowledge.scraper.cli:app"
knowledge = "knowledge.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The package directory is the project root: `knowledge` maps to `.`, so its
# subpackages are the directories beside this file. New subpackages go in `packages`.
[tool.setuptools]
package-dir = { "knowledge" = "." }
packages = [
    "knowledge",
    "knowledge.api",
    "knowledge.index",
    "knowledge.memory",
    "knowledge.scraper",
    "knowledge.scraper.sources",
    "knowledge.store",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
