# Weekly grouped updates, so a dependency bump is one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /apps/scraper
    schedule: { interval: weekly }
    groups:
      scraper: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /apps/training
    schedule: { interval: weekly }
    groups:
      training: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
