name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gate a branch on demand. A pull request into anything but main runs no other trigger, so a
  # stacked branch has no gate without this.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each unit's job runs only when that unit, or the tooling it depends on, changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      python: ${{ steps.python.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - justfile
              - .github/workflows/ci.yml
              # Every unit reads it, and a test holds the committed file to what the engine accepts.
              - sparky.toml
            rust:
              - *shared
              - apps/engine/**
              - apps/discord/**
              - apps/cli/**
              - Cargo.toml
              - Cargo.lock
              - scripts/check-deps.sh
            web:
              - *shared
              - apps/web/**
            scraper:
              - *shared
              - apps/scraper/**
            training:
              - *shared
              - apps/training/**
      - id: python
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          SCRAPER: ${{ steps.filter.outputs.scraper }}
          TRAINING: ${{ steps.filter.outputs.training }}
        run: |
          pkgs=()
          { [ "$SCRAPER" = true ] || [ "$ALL" = true ]; } && pkgs+=(scraper)
          { [ "$TRAINING" = true ] || [ "$ALL" = true ]; } && pkgs+=(training)
          echo "pkgs=$(printf '%s\n' "${pkgs[@]}" | jq -Rc 'select(length>0)' | jq -sc .)" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just check-rust

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: cd apps/web && npm ci
      - run: just check-web

  python:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.changes.outputs.python) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: cd apps/${{ matrix.pkg }} && uv sync --extra dev
      - run: just check-${{ matrix.pkg }}
