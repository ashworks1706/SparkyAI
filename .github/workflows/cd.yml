name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # An image is rebuilt only when its inputs changed. workflow_dispatch rebuilds all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/cd.yml
            rust:
              - *shared
              - apps/engine/**
              - apps/discord/**
              - Cargo.toml
              - Cargo.lock
              - deploy/docker/rust.Dockerfile
            scraper:
              - *shared
              - apps/scraper/**
              - deploy/docker/scraper.Dockerfile
            sandbox:
              - *shared
              - apps/sandbox/**
              - deploy/docker/sandbox.Dockerfile
      - id: images
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          RUST: ${{ steps.filter.outputs.rust }}
          SCRAPER: ${{ steps.filter.outputs.scraper }}
          SANDBOX: ${{ steps.filter.outputs.sandbox }}
        run: |
          list=()
          { [ "$ALL" = true ] || [ "$RUST" = true ]; } && list+=(rust)
          { [ "$ALL" = true ] || [ "$SCRAPER" = true ]; } && list+=(scraper)
          { [ "$ALL" = true ] || [ "$SANDBOX" = true ]; } && list+=(sandbox)
          echo "list=$(printf '%s\n' "${list[@]}" | jq -Rc 'select(length>0)' | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.name }}.Dockerfile
          push: true
          tags: |
            ghcr.io/ashworks1706/sparkyai-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/ashworks1706/sparkyai-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
