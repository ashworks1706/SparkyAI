# SparkyAI settings, read by every app. SPARKY_<SECTION>__<KEY> environment variables win.
# Secrets and per-machine URLs live in .env. SPARKY_CONFIG_FILE points to another file.

[app]
log_level = "info,discord=debug"

# ---------------------------------------------------------------- the agent loop
[agent]
max_steps = 12
max_model_retries = 2
request_timeout_secs = 110            # below the bot engine.request_timeout_secs of 120
tool_timeout_secs = 20
confirmation_ttl_secs = 600
model_slots = 2                # match llama-server --parallel
model_queue_wait_secs = 30
max_turns = 16                 # turns running at once
turn_queue_wait_secs = 20      # longest a turn waits for a slot before it is refused as busy
temperature = 0.6
history_turns = 20
memory_recall_limit = 10
# Recall memory and the profile graph in channels others can read.
recall_in_public = false

# Prompt budgets in estimated tokens. A section budget over the total is rejected at boot.
# Tool schemas count against prompt_budget_tokens and must fit in half of it.
prompt_budget_tokens = 5500
history_budget_tokens = 1000
memory_budget_tokens = 300
capabilities_budget_tokens = 600
# Budget of the earlier Sparky message a reply quotes into the prompt.
reply_budget_tokens = 200
# Images of one message passed to the model.
max_images = 4
# Other files of one message copied into the sandbox workspace, their largest size,
# and the hosts they are downloaded from.
max_files = 4
max_file_bytes = 2000000
file_hosts = ["cdn.discordapp.com", "media.discordapp.net"]
upload_preview_chars = 800       # characters of the start of an attached file's text put beside the question
upload_match_chars = 2400        # characters of its passages that match the question
upload_ocr_pages = 3             # pages of a scanned PDF read by OCR
chars_per_token = 4
# Fraction added to prompt_budget_tokens for the chat template. The sum with
# model.max_tokens_without_thinking must fit one chat slot.
prompt_estimate_headroom = 0.3

retry_base_ms = 250
retry_cap_ms = 8000
max_span_value_chars = 32000
# A tool result longer than this goes to the sandbox workspace, replaced by its head and path.
# 0 keeps every result whole.
tool_result_to_file_chars = 6000
# Characters of arguments and result on a live progress line, and of reasoning on the thinking line.
progress_detail_chars = 160
progress_thought_chars = 600
# Stream model calls to the watcher. stream_block_chars is the longest run held back
# before a draft block is sent.
stream = true
stream_block_chars = 160

# Whether a model call reasons before it answers. Reasoning shows on the thinking line, never in the answer.
[agent.thinking]
mode = "auto"                  # on, off, or auto
# auto, first match: no tools offered, off; the latest tool call failed or returned nothing,
# recover; a cue or over max_quick_chars, on; after tool results, after_tools; before any tool
# has run, plan_searches; else off.
after_tools = false
max_quick_chars = 160
plan_searches = false
recover = true
cues = ["why", "compare", "difference", "explain", "should i", "recommend", "plan", "pros and cons"]
# Repeat without thinking a call that thought and returned no answer and no tool call.
retry_without = true

# ---------------------------------------------------------------- what the model is told
# Changes here change the prompt hash. system_file overrides system, which overrides the built-in default.
[prompt]
# system_file = "prompts/sparky.md"
role_line = "The user is `{user}`. Roles: {roles}."
role_line_no_roles = "The user is `{user}`. They hold no special roles."
memory_header = "What you remember about this user:"
capabilities_header = "What you can do. Each line is a name, how it runs, and what it does."
# {date} is filled in at assembly.
date_line = "Today is {date}. Search results are labelled by day or date; read the label the question asks for, never the first value in a row."
reply_header = "The user replied to this earlier message of yours. It is what they are answering, so read it as the immediate context of what they say next."
# Closes a tool result cut to fit the prompt; {chars} is how much was left out.
result_cut_line = "[{chars} more characters of this result were cut to fit. Search again with a narrower query to read them.]"
answer_only_line = "You have no tools on this step. Answer the user now in plain text from what you already have, or say what you could not find. Do not write a tool call."
# Sent after a tool failed and run_sandbox was not tried. Empty turns it off.
sandbox_retry_line = "A tool you called this turn failed, and you have not opened the page yourself. Do that now: call run_sandbox and fetch the page the question is about, then answer from what it prints. Tell the user you could not find something only after that has been tried."
# One line per attached file. {preview} is the start of its text, {matches} the best
# matching passages, and {text_path} the full text.
upload_line = "The user attached {name} ({kind}, {size}). Its text, {chars} characters, is at {text_path} in the sandbox workspace, session {session}; the file itself is at {path}. It begins:\n{preview}\n\nThe passages of it that hold the most words of the question:\n{matches}\n\nAnswer a question about this file from these passages, never from search results or memory. When they do not hold the answer, read more with run_sandbox in session {session}: rg -i -n -C 3 SUBJECT {text_path}, or sed -n START,ENDp {text_path} around a line number above."
# An attached file with no extractable text.
upload_raw_line = "The user attached {name} ({kind}, {size}). It is at {path} in the sandbox workspace, session {session}, and no text could be pulled from it automatically. Open it with run_sandbox in that session before you answer: file {path} says what it is, and python3 with pypdf, docx, openpyxl or pandas, or pdftoppm and tesseract for a scan, reads it."
upload_failed_line = "The user attached {name} ({kind}), but it could not be opened: {reason}. Say so if the question depends on it."
utc_offset_hours = -7          # Arizona, no daylight saving

# ---------------------------------------------------------------- the model
# base_url and api_key are per-machine and live in .env.
[model]
name = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
# Token budget of a call that thinks, reasoning and answer together. With the prompt it
# must fit one chat slot.
max_tokens = 2560
# Token budget of a call that does not think.
max_tokens_without_thinking = 1024
usd_per_m_prompt = 0.0
usd_per_m_completion = 0.0

# Sampling sent to the server; unset keys use server defaults.
[model.sampling]
top_p = 0.9
top_k = 20
min_p = 0.0
presence_penalty = 1.0
# repeat_penalty = 1.05
# seed = 42

# base_url and api_key are per-machine and live in .env.
[embedding]
name = "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0"
dim = 1024

# ---------------------------------------------------------------- retrieval
# Dense and lexical legs fused by reciprocal rank fusion. Both off is rejected at boot.
[retrieval]
top_k = 6                      # chunks search_knowledge returns per call
dense = true                   # send a query vector, so the platform runs its dense leg
# Rows either side of a hit joined into one passage; overlapping windows merge. 0 returns the hit alone.
window = 2

# ---------------------------------------------------------------- what may run
# Risk classes in order: read_public, read_authenticated, prepare_write, external_write,
# destructive, forbidden.
[policy]
write_roles = ["MANAGE_GUILD"]
allow_authenticated_reads = false
confirm_from = "external_write"

# search_knowledge reads the platform knowledge base; search_live runs a live query on the platform.
# The descriptions are the tool text the model reads. The catalog appends per-source hints
# to source_description.
[tools]
disabled = []
search = true
# Source search_live fetches when a call names none. Must be a source the engine offers.
live_default_source = "web"
knowledge_description = "Search the stored knowledge base of ASU pages: programs, policies, admissions, advising, buildings, services and offices, anything that changes rarely. Nothing is looked up before you are called, so search it for any such question. Send several searches with different wording in one step."
live_description = "Fetch an ASU source or the open web right now. Use it when the answer has to be current, such as hours today, open seats, shuttle times, events, news or scores, or when the knowledge base holds nothing."
query_description = "What to search for, in keywords. This string is the whole request: the tool reads nothing else from the conversation, so name the subject in full and write no pronoun and no bare word. Bad: hours. Good: Hayden Library hours Sunday. Bad: does it have space left. Good: CSE 310 Fall 2026 open seats."
source_description = "Narrows the search to one source. Leave it out unless the question is plainly about that one source: a wrong source returns nothing even when the answer is stored."
nothing_stored = "The knowledge base holds nothing for that query. If you named a source, search again without it. Otherwise search again with the subject named differently, or call search_live, or open the page yourself with run_sandbox. Say you do not have it only once all of that has been tried this turn."

# The classifier and graph agent, run after the turn. Enabled, each turn costs two extra model calls.
[profile]
enabled = true
max_tokens = 512
timeout_secs = 60
# Withdraw a recorded fact a new fact for the same subject and relation contradicts. Costs a model call.
reconcile = true
min_confidence = 0.5           # extracted facts below this, or with an empty label, are dropped
list_limit = 50               # nodes and relations POST /profile/list returns, each
request_timeout_secs = 30      # budget for one /profile/list or /profile/forget call

# Rule-based gate on extraction. Empty lists use the built-in ones.
[profile.detector]
subjects = []
cues = []
min_words = 4

# run_sandbox: a command in an isolated container. With egress on it reaches only the egress proxy.
# required = true refuses to boot without a container runtime; false runs without run_sandbox.
[sandbox]
enabled = true
required = false
runtime = "docker"
image = "ghcr.io/theaisocietyasu/sparkyai-sandbox:main"
memory = "256m"
cpus = "1"
pids = 128
timeout_secs = 20
max_output_chars = 4000
risk = "prepare_write"
session_idle_secs = 900        # how long a named session stays up with nothing running
max_sessions = 4               # sessions one user holds at once; a new one reaps the oldest
max_sessions_total = 16        # session containers across every user; a new one reaps the least recently used
max_running = 8                # commands running at once across every user; more wait for a slot
instance = "default"           # names this engine's containers; give each engine on one runtime its own
workspace_mb = 64
recent_commands = 200          # commands kept for the console view of what Sparky ran
egress = true
egress_network = "sparky-sandbox"
egress_proxy_image = "ghcr.io/theaisocietyasu/sparkyai-sandbox-proxy:main"
egress_proxy_name = "sparky-sandbox-proxy"
description = "Run a shell command in an isolated Linux environment. Reach for it whenever a search did not give you what you need, before you tell the user you could not find something, and for any file the user attached or any tool result too long to read whole. It has python3 with requests, bs4, lxml, pandas, numpy, pypdf, docx, openpyxl, xlrd, PIL, yaml and markdown; pdftotext, pdftoppm and tesseract for PDFs and scans; curl, wget, jq, rg, sqlite3, file, unzip and the usual text tools. It can fetch public web pages over HTTP and HTTPS, for example to read the ASU page a search pointed at. Files the user attached and long results from other tools are already in the workspace, and the prompt or the result names the path and session; read them here with rg, grep or python3."
command_description = "The shell command to run."
session_description = "Name a session to keep files in the workspace between calls. Reuse the same name to resume it. Results an earlier tool wrote to the workspace name the session they are in."

# The gate every model response passes. denied_phrases block an answer wherever they appear.
# protected_terms are removed from an answer as whole words; the registered tool names are added
# to them at boot, so the agent cannot spill a tool name to a student.
[guardrail]
enabled = true
denied_phrases = []
protected_terms = []
redaction = "[hidden]"
max_answer_chars = 8000
replacement = "I cannot answer that. Ask a moderator if you need help."

# Replaces history past its budget with one summary turn. Off drops the oldest turns.
[compaction]
enabled = true
max_tokens = 512
# Share of agent.history_budget_tokens kept as recent turns. keep_share times it plus max_tokens must fit it.
keep_share = 0.4
temperature = 0.0
timeout_secs = 30
# instructions = "You compact a conversation..."

# Live source queries on the platform. timeout_secs is the whole budget of one.
[query]
timeout_secs = 90

# ---------------------------------------------------------------- MCP
# Servers go in [[mcp.servers]] and are not settable from the environment. None is configured.
[mcp]
required_props_only = true
max_output_chars = 6000
max_schema_description_chars = 80
max_tool_description_chars = 160

# [[mcp.servers]]
# name = "example"
# url = "http://localhost:9000/mcp"
# tools = []
# required_props_only = true
# tool_timeout_secs = 45
# risks = { page_snapshot = "read_public" }   # per-tool class in place of the one derived from the name

# Outlook calendar and mail, read-only, in a direct message only. Reads the caller's Microsoft
# account linked on the platform.
[outlook]
enabled = false
base_url = "https://graph.microsoft.com/v1.0"
timeout_secs = 30
max_items = 15

# Google Calendar, read-only, in a direct message only. Each caller reads their own calendar
# through the Google account linked on the platform.
[gcal]
enabled = false
base_url = "https://www.googleapis.com/calendar/v3"
timeout_secs = 30
max_items = 15

# Academic paper search over Semantic Scholar. Public, no key.
[papers]
enabled = true
base_url = "https://api.semanticscholar.org/graph/v1"
timeout_secs = 20
max_items = 5

# Wikipedia lookups over the MediaWiki API. Public, no key.
[wikipedia]
enabled = true
base_url = "https://en.wikipedia.org/w/api.php"
timeout_secs = 20
max_chars = 1500

# ---------------------------------------------------------------- traces
[trace]
enabled = true
dir = ".sparky/traces"
max_file_bytes = 2000000       # later events of one request are dropped past this; 0 removes the limit
retention_hours = 336          # pruned hourly; 0 keeps them forever

# Spans export to Phoenix at phoenix_url plus /v1/traces. phoenix_url and phoenix_api_key
# live in .env; an empty phoenix_url turns export off. project_name is the Phoenix project.
[telemetry]
project_name = "sparky"
sample_ratio = 1.0
export_timeout_secs = 10
provider_name = "llama.cpp"

# Discord product events, one span each.
[analytics]
enabled = true

# ---------------------------------------------------------------- the HTTP surface
[http]
max_body_bytes = 1048576
concurrency_limit = 0          # 0 removes the limit
rate_limit_per_min = 0         # per user, 0 removes the limit
cors_origins = []              # ["*"] for the Vite dev server
shutdown_grace_secs = 10

# ---------------------------------------------------------------- the Discord bot
[bot]
channels = []                  # empty answers in every channel it can see
max_message_chars = 2000       # the Discord hard limit
edit_every_ms = 1500
cooldown_secs = 0
write_capability = "MANAGE_GUILD"
thread_auto_archive_minutes = 1440   # 60, 1440, 4320, or 10080; threads the bot opens for answers
# Direct messages get the profile graph and personal memory.
direct_messages = true
# Images of one message sent to the model; needs a vision model. 0 sends none.
max_images = 4
# Other files of one message sent to the engine, and their largest size.
max_files = 4
max_file_bytes = 2000000

# ---------------------------------------------------------------- platform
# Conversations, memories, the profile graph, confirmations, knowledge search, live queries and
# linked accounts come from the platform HTTP API. So do Canvas, the Sun Devil Central clubs and
# events, and the ASU knowledge. url and token live in .env and are required.
# The token needs these scopes:
#   agents:read, agents:write   conversations, memories, the profile graph, confirmations
#   knowledge:read              knowledge search and the live queries
#   accounts:link               the /login link for a member
#   accounts:token              the Outlook and Google tokens of a member
#   asu:read                    platform_asu_clubs and platform_asu_events
#   canvas:read                 the platform_canvas_* tools
[platform]
timeout_secs = 10              # one platform call; a live query uses what is left of the request
embedding_model = ""           # sent with each query vector; empty sends embedding.name
max_query_chars = 1000         # longest search query sent; the platform refuses longer
# Platform tools over MCP, with the same token. Set SPARKY_PLATFORM__MCP_URL (for example
# http://127.0.0.1:8001/mcp) to register them as platform_<name>. The token scopes decide which
# tools exist. Read tools run for anyone; write tools need policy.write_roles and a confirmation.
mcp_url = ""
mcp_tools = []                 # e.g. ["org.info", "events.list"]; empty registers every allowed tool
# Tool name prefixes whose results belong to one member. Such a tool runs only in a direct
# message, is ReadAuthenticated, and is sent the caller as discord_id in place of the model's value.
mcp_private = ["canvas."]

# ---------------------------------------------------------------- the developer console
[cli]
phoenix_url = "http://localhost:6006"
log_lines = 5000
log_dir = ".sparky/logs"
log_file_max_mb = 20           # a unit log past this is rotated to one .1 file
log_line_chars = 4000          # longest line kept from a unit's output
health_interval_secs = 5
port_check_ms = 150

# ---------------------------------------------------------------- evals
# engine_url and engine_service_token live in .env.
[evals]
state_dir = "../../.sparky"
cases_dir = "cases"
baseline_path = "baseline.json"
request_timeout_secs = 180.0
