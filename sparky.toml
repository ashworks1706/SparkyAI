# SparkyAI settings. Committed, reviewed, and read by every app.
#
# Two layers, lowest first: this file, then SPARKY_<SECTION>__<KEY> environment variables,
# which win. Secrets, per-machine URLs and the values docker compose overrides live in .env.
# Anything tunable lives here.
#
# Read by apps/engine, apps/discord and apps/cli (Rust, figment) and by apps/scraper and
# apps/training (Python, tomllib through pydantic-settings). Point elsewhere with
# SPARKY_CONFIG_FILE.

[app]
log_level = "info,discord=debug"

# ---------------------------------------------------------------- the agent loop
[agent]
max_steps = 8
max_model_retries = 2
request_timeout_secs = 90
tool_timeout_secs = 20
confirmation_ttl_secs = 600
model_slots = 2                # match llama-server --parallel
model_queue_wait_secs = 30
temperature = 0.6
history_turns = 20
memory_recall_limit = 10
# Recall memory and the profile graph where others can read the answer.
recall_in_public = false

# Prompt budgets in estimated tokens. A section budget above the total is rejected at boot.
# chars_per_token converts characters to estimated tokens; lower it for a tokenizer that splits
# URLs and course codes finely. Tool schemas count against prompt_budget_tokens, and the engine
# refuses to boot when they take over half of it. The prompt and model.max_tokens share one
# llama-server slot: ctx-size 16384 over --parallel 2 is 8192 a slot.
prompt_budget_tokens = 4000
evidence_budget_tokens = 1200
history_budget_tokens = 1000
memory_budget_tokens = 300
capabilities_budget_tokens = 600
# Cap on the message of Sparky's that a reply quotes back into the prompt.
reply_budget_tokens = 200
# Images of one message the engine passes to the model. The edge caps what it sends in
# bot.max_images; this caps what the HTTP surface accepts from any caller holding the token.
max_images = 4
chars_per_token = 4
# Fraction added to prompt_budget_tokens for the chat template. At boot the sum, with
# model.max_tokens_without_thinking, must fit one slot of the chat server.
prompt_estimate_headroom = 0.3

retry_base_ms = 250
retry_cap_ms = 8000
max_span_value_chars = 32000
# A tool result longer than this is written to the sandbox workspace and replaced by its head
# and the path, so it stops riding in the conversation for every later step of the turn. It needs
# the sandbox. 0 carries every result whole, which is what the loop has always done.
tool_result_to_file_chars = 6000
# Characters of the arguments and of the result that one live progress line carries to
# whoever is watching the turn, and of the reasoning the thinking line carries.
progress_detail_chars = 160
progress_thought_chars = 600
# Stream model calls: the thinking line follows the reasoning, and the answer is shown as a
# draft a block at a time. A block ends at a sentence or a line; stream_block_chars is the
# longest run held back waiting for one. Live pieces reach the watcher only; the recorded trace
# keeps the finished call.
stream = true
stream_block_chars = 160

# Whether a model call reasons before it answers. The reasoning is shown as the live thinking
# line and never reaches the answer. Tasks such as compaction never think.
[agent.thinking]
mode = "auto"                  # on, off, or auto
# auto takes the first rule that applies: a call offered no tools does not think; a step with
# tool results thinks when after_tools is set; a question holding a cue, longer than
# max_quick_chars, or that retrieval ran for and found nothing for thinks; anything else does not.
after_tools = true
max_quick_chars = 80
cues = ["why", "how", "compare", "difference", "should", "plan", "explain", "which"]
# A call that thought and left no answer and no tool call is made again without thinking.
retry_without = true

# ---------------------------------------------------------------- what the model is told
# Changing any of this changes the prompt hash. system_file beats system, which beats the
# built-in default.
[prompt]
# system_file = "prompts/sparky.md"
role_line = "The user is `{user}`. Roles: {roles}."
role_line_no_roles = "The user is `{user}`. They hold no special roles."
memory_header = "What you remember about this user:"
evidence_header = "Stored copies of pages from the knowledge base, closest match first, each with when it was fetched. They may be out of date or may not answer the question. When the question needs current information, such as hours today, shuttles, events, news or scores, call search_live first. When these entries do not answer it, call search_knowledge with the subject named in full. Otherwise answer from them and from tool output only, and cite the bracketed number of every entry you use."
no_evidence_line = "The knowledge base returned nothing for this question. Before you answer, call search_knowledge with the subject of the question written out in keywords, or call search_live when the answer has to be current. Say you do not have it only after one of them comes back empty."
# Written instead when retrieval.router skipped retrieval, one line per reason.
no_retrieval_line = "The knowledge base was not searched for this message: it asks for no ASU fact. Answer it directly and briefly, and cite nothing."
live_only_line = "The knowledge base was not searched for this question: the answer has to be current, and a stored copy would be out of date. Call search_live with the subject written out in keywords, and answer from what it returns, or say you do not have it."
# Written instead when the knowledge base could not be read at all.
no_index_line = "The knowledge base could not be read for this question, so nothing from it is in this prompt. That is a fault on our side, not an answer. Call search_live with the subject written out in keywords, open the page yourself if what comes back is thin, and answer from that. Never tell the user the knowledge base is down."
capabilities_header = "What you can do. Each line is a name, how it runs, and what it does."
# {date} is filled in at assembly.
date_line = "Today is {date}. Evidence rows are labelled by day or date; read the label the question asks for, never the first value in a row."
reply_header = "The user replied to this earlier message of yours. It is what they are answering, so read it as the immediate context of what they say next."
# Closes a tool result cut to fit the prompt; {chars} is how much was left out.
result_cut_line = "[{chars} more characters of this result were cut to fit. Search again with a narrower query to read them.]"
answer_only_line = "You have no tools on this step. Answer the user now in plain text from what you already have, or say what you could not find. Do not write a tool call."
# Sent back when a tool failed and the sandbox was not tried, so the loop takes the last route
# before it gives up. Empty turns the hand-back off.
sandbox_retry_line = "A tool you called this turn failed, and you have not opened the page yourself. Do that now: call run_sandbox and fetch the page the question is about, then answer from what it prints. Tell the user you could not find something only after that has been tried."
utc_offset_hours = -7          # Arizona, no daylight saving

# ---------------------------------------------------------------- the model
# base_url and api_key are per-machine and live in .env.
[model]
name = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
# Token budget of a call that thinks, reasoning and answer together. One slot holds the prompt
# and this: chat ctx-size 16384 over --parallel 2 is 8192 a slot. See agent.thinking.
max_tokens = 4096
# Token budget of a call that does not think.
max_tokens_without_thinking = 1024
usd_per_m_prompt = 0.0
usd_per_m_completion = 0.0

# Only what is set is sent; server defaults apply to the rest. Values follow the Qwen3
# recommended settings plus a presence penalty. agent.temperature pairs with them.
[model.sampling]
top_p = 0.9
top_k = 20
min_p = 0.0
presence_penalty = 1.0
# repeat_penalty = 1.05
# seed = 42

# base_url and api_key are per-machine and live in .env.
[embedding]
name = "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0"
dim = 1024
batch_size = 32                # apps/scraper only
timeout_secs = 120.0           # apps/scraper only, one embedding request

# The model that writes a tree node summary. base_url and api_key are per-machine and live
# in .env.
[summary]
name = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
max_tokens = 512
temperature = 0.2
timeout_secs = 120
thinking = false               # true spends the whole budget on reasoning and returns empty content

# ---------------------------------------------------------------- retrieval
# Two legs fused with reciprocal rank fusion. Turning both off is rejected at boot.
[retrieval]
top_k = 6                      # evidence chunks handed to the prompt
candidates = 20                # pulled from each leg before fusion
rrf_k = 60.0
text_search_config = "english"
dense = true
lexical = true
min_score = 0.0
max_distance = 0.6             # cosine distance past which a dense match is dropped; 2.0 keeps all
# Rows either side of a hit read back with it, joined into one passage. Chunks are indexed
# narrow so a match is precise; the window is what gives the model enough around it to read.
# Overlapping windows merge, so nearby hits cost one passage, not two. 0 hands back the hit alone.
window = 2

# The rule gate in front of retrieval, run on every turn. It is rules, not a model call, so it
# costs nothing on the critical path. Empty lists use the built-in ones. A turn holding a live cue
# skips retrieval and is answered from a search tool; a turn of at most max_chitchat_words that
# holds a chitchat marker and no live cue skips it and is answered directly. A skipped turn also
# does not think: the no_evidence thinking rule applies only when retrieval actually ran.
[retrieval.router]
enabled = true
max_chitchat_words = 4
chitchat = []
live = []

# ---------------------------------------------------------------- what may run
# Risk classes in order: read_public, read_authenticated, prepare_write, external_write,
# destructive, forbidden.
[policy]
write_roles = ["MANAGE_GUILD"]
allow_authenticated_reads = false
confirm_from = "external_write"

# Two search tools over the same set of ASU sources: search_knowledge reads the stored index,
# search_live queues a fetch for the scraper. Both take a query and an optional source filter.
#
# The wording below is what the model reads immediately before it writes a query, so it is the
# highest-leverage text in the prompt. With one tool per source the tool name carried half the
# intent; with two tools the query string has to carry all of it, which is what query_description
# is for. Keep it concrete and short: a 4B model follows a bad-then-good pair and ignores an
# adjective. The per-source hints appended to source_description come from the catalog.
[tools]
disabled = []
search = true
# The source search_live fetches when a call names none. Must be a source the engine offers.
live_default_source = "web"
knowledge_description = "Search the stored knowledge base of ASU pages. Use it when the results already in this prompt do not answer, or you need a different part of the same page."
live_description = "Fetch an ASU source or the open web right now. Use it when the answer has to be current, such as hours today, open seats, shuttle times, events, news or scores, or when the knowledge base holds nothing."
query_description = "What to search for, in keywords. This string is the whole request: the tool reads nothing else from the conversation, so name the subject in full and write no pronoun and no bare word. Bad: hours. Good: Hayden Library hours Sunday. Bad: does it have space left. Good: CSE 310 Fall 2026 open seats."
source_description = "Narrows the search to one source. Leave it out to search all of them, which is right unless you already know which source holds the answer."
nothing_stored = "The knowledge base holds nothing for that query. Search again with the subject named differently, or call search_live, or open the page yourself with run_sandbox. Say you do not have it only once all three have been tried this turn."

# The classifier and the graph agent, detached from the request that produced the turn.
# Enabled, every turn costs two extra model calls.
[profile]
enabled = true
max_tokens = 512
timeout_secs = 60
# Withdraw a recorded fact when a new one makes it false. Costs a model call when a new fact
# collides with one recorded for the same subject and relation.
reconcile = true
min_confidence = 0.5           # extracted facts below this, or with an empty label, are dropped
list_limit = 50               # nodes and relations POST /profile/list returns, each
request_timeout_secs = 30      # budget for one /profile/list or /profile/forget call

# The rule-based gate on extraction, run on every turn. Empty lists use the built-in ones. A
# turn passes when a first-person marker sits next to a cue and it is not a question.
[profile.detector]
subjects = []
cues = []
min_words = 4

# A command in an isolated environment. The engine needs access to the container runtime: under
# compose that is the sandboxd service, and on the host it is the local docker. Read-only root,
# dropped capabilities, non-root user, workspace wiped with the session. With egress off it has
# no network. With it on, the container joins egress_network, which the engine creates internal,
# and reaches only the egress proxy: public HTTP and HTTPS, never a private or loopback address.
# required decides what an unreachable runtime means: false leaves run_sandbox unregistered and
# the engine runs without it, true refuses to boot. It is false here so a fresh clone runs with
# no container runtime; deploy/compose.prod.yml sets it true, where a missing sandbox is a fault.
[sandbox]
enabled = true
required = false
runtime = "docker"
image = "ghcr.io/ashworks1706/sparkyai-sandbox:main"
memory = "256m"
cpus = "1"
pids = 128
timeout_secs = 20
max_output_chars = 4000
risk = "prepare_write"
session_idle_secs = 900        # how long a named session stays up with nothing running
max_sessions = 4               # sessions one user holds at once; a new one reaps the oldest
workspace_mb = 64
egress = true
egress_network = "sparky-sandbox"
egress_proxy_image = "ghcr.io/ashworks1706/sparkyai-sandbox-proxy:main"
egress_proxy_name = "sparky-sandbox-proxy"
description = "Run a shell command in an isolated Linux environment. Reach for it whenever a search did not give you what you need, before you tell the user you could not find something. It has python3 with requests, bs4, lxml and pandas, curl, wget, jq, rg, sqlite3, pdftotext and the usual text tools. It can fetch public web pages over HTTP and HTTPS, for example to read the ASU page a search pointed at. A long result from another tool is saved in the workspace and the result names the file; read it here with rg, grep or python3."
command_description = "The shell command to run."
session_description = "Name a session to keep files in the workspace between calls. Reuse the same name to resume it. Results an earlier tool wrote to the workspace name the session they are in."

# The gate every model response passes, on the capability branch and the answer branch.
[guardrail]
enabled = true
denied_phrases = []
max_answer_chars = 8000
replacement = "I cannot answer that. Ask a moderator if you need help."

# The chat agent. Replaces the turns that no longer fit with one turn that does. Off leaves
# history trimmed by dropping the oldest turns.
[compaction]
enabled = true
max_tokens = 512
# Share of agent.history_budget_tokens kept as recent turns when history is compacted. Compaction
# runs only once history is over its budget, and keep_share times it plus max_tokens must fit it.
keep_share = 0.4
temperature = 0.0
timeout_secs = 30
# instructions = "You compact a conversation..."

# Live source queries. They need just scraper serve running.
#
# The engine waits on the scraper by polling the jobs row. poll_ms is the first wait and it doubles
# up to poll_max_ms, so a 30 second fetch costs a handful of round trips rather than one every
# 100ms for its whole duration. max_in_flight caps how many fetches reach the database at once,
# across every replica, held in the same Redis as the cache below. Over the cap a search tool is
# refused with something the model can act on, which beats queueing onto the connection pool until
# it times out. The cap sits under the cache, so a reused answer and a request that waited on
# another cost the database nothing and take no slot.
[query]
timeout_secs = 90
poll_ms = 100
poll_max_ms = 1000
max_in_flight = 16             # 0 removes the cap; keep it under postgres.max_connections
claim_secs = 5                 # a query the scraper does not claim in this long reports that it is not running

# Tool output caching for live queries, in Redis, shared by every engine replica. url is
# per-machine and lives in .env as SPARKY_REDIS__URL; without it this must be off.
#
# Two things happen here. An answer within its lifetime is returned without touching the scraper.
# And whatever the lifetime, only one request fetches a given query at a time: the rest wait on its
# lease and read the answer it writes, so a hundred students asking at once is one fetch, not a
# hundred. A cached answer carries how old it is into the tool output, so the model never calls a
# reused result current.
#
# handoff_secs is the floor under every source: an answer has to outlive its own fetch for the
# requests that waited on it to read it. So a source at ttl 0 is reused for that long and no
# longer, which is what every source that is never indexed defaults to. Coalescing itself costs no
# freshness: a request that waited gets an answer fetched after it asked. Reuse does, so keep the
# floor small.
#
# Caching is safe here because a source query only ever reads: the search tools are all
# ReadPublic and anything that writes goes through Policy, never through this path.
[query.cache]
enabled = true
default_ttl_secs = 900         # an answer of a source the scraper indexes, citable anyway
live_ttl_secs = 0              # an answer of a source that is never indexed: the floor below only
handoff_secs = 5               # floor under every lifetime, so the requests that waited read it
lease_secs = 120               # must cover query.timeout_secs, or two requests fetch the same query
poll_ms = 100                  # how often a waiting request looks for the answer
timeout_ms = 500               # a cache slower than this is treated as one that is not there

# Per source, by registry key. Anything not named here takes the default for its kind above.
[query.cache.ttl_secs]
library_hours = 3600
campus_map = 86400
course_catalog = 86400         # a catalog entry changes between terms, not within one
dining = 3600
social_media = 1800
sports_news = 900
news = 900
courses = 300                  # open seat counts move during registration

# ---------------------------------------------------------------- MCP
# Servers go in [[mcp.servers]] and are not settable from the environment. None is configured.
[mcp]
required_props_only = true
max_output_chars = 6000
max_schema_description_chars = 80
max_tool_description_chars = 160

# [[mcp.servers]]
# name = "example"
# url = "http://localhost:9000/mcp"
# tools = []
# required_props_only = true
# tool_timeout_secs = 45

# ---------------------------------------------------------------- traces
[trace]
enabled = true
dir = ".sparky/traces"
max_file_bytes = 0             # 0 removes the limit
retention_hours = 0            # 0 keeps them forever

# Spans go to Phoenix over OTLP/HTTP at phoenix_url plus /v1/traces. phoenix_url is
# per-machine and phoenix_api_key is a secret; both live in .env. An empty phoenix_url turns
# export off. Set SPARKY_TELEMETRY__PHOENIX_URL=http://localhost:6006 with just phoenix running
# to read a conversation as a trace tree. project_name is the Phoenix project every app writes
# to and the training export reads back.
[telemetry]
project_name = "sparky"
sample_ratio = 1.0
export_timeout_secs = 10
provider_name = "llama.cpp"

# Discord product events, exported to Phoenix as one span each through telemetry.
[analytics]
enabled = true

# ---------------------------------------------------------------- the HTTP surface
[http]
max_body_bytes = 1048576
concurrency_limit = 0          # 0 removes the limit
rate_limit_per_min = 0         # per user, 0 removes the limit
cors_origins = []              # ["*"] for the Vite dev server
shutdown_grace_secs = 10

# ---------------------------------------------------------------- the Discord bot
[bot]
channels = []                  # empty answers in every channel it can see
max_message_chars = 2000       # the Discord hard limit
edit_every_ms = 1500
cooldown_secs = 0
write_capability = "MANAGE_GUILD"
thread_auto_archive_minutes = 1440   # 60, 1440, 4320, or 10080; threads the bot opens for answers
# A direct message is private, so the profile graph and personal memory apply to it and not to
# an answer in a server. See agent.recall_in_public.
direct_messages = true
# Images of one message sent to the model. The model has to be one that reads images; see
# deploy/inference/README.md. 0 sends none.
max_images = 4

# ---------------------------------------------------------------- postgres
# url carries the password and lives in .env.
[postgres]
max_connections = 10
acquire_timeout_secs = 5

# ---------------------------------------------------------------- the scraper
[scraper]
tenant_id = "public"           # public ASU content, readable by every guild
fetcher = "firecrawl"          # firecrawl renders JS and returns markdown; http is plain httpx
user_agent = "SparkyAI/2.0 (+https://github.com/ashworks1706/SparkyAI)"
request_timeout_secs = 30.0
# Indexed narrow so a match points at the passage that answers, not at a whole section.
# retrieval.window reads the neighbours back with the hit at query time, so overlap here
# would only repeat text inside the passage the model is handed. Changing either value
# changes chunker_version, so the next run of a source reindexes it.
chunk_chars = 300
chunk_overlap_chars = 0
index_live_results = true          # index a live result after answering, for sources that allow it
serve_poll_secs = 0.5              # longest a lane of scraper serve waits before looking again
schedule_every_secs = 60.0         # how often scraper serve queues scheduled runs that fell due
job_lease_secs = 1800.0            # a background job running longer is queued again
host_gap_secs = 5.0                # shortest gap between scheduled fetches to one host; ASU rate limits bursts
query_max_chars = 6000             # a live result is always kept in the prompt; about 1500 tokens
# Back pressure on the one table every process writes to. Past index_backlog_limit queued
# live_index jobs a live result is answered but not indexed: answering is what a student is
# waiting on, and the source is refetched on its schedule anyway. Finished jobs are removed after
# job_retention_hours so the queue stays small enough to claim from quickly.
index_backlog_limit = 500
job_retention_hours = 72.0         # 0 keeps every finished job forever
job_prune_batch = 5000             # finished jobs removed per scheduling cycle
parser_version = "bs4-text-v1"
# A fetch yielding less than this fraction of the last good run is refused.
quality_floor_ratio = 0.5
quality_floor_min_chars = 500     # the floor applies only when the last good run had this many chars
# A RAPTOR style tree over the chunks of one source. Costs a model call per cluster per level.
# Retrieval searches every level at once.
tree_enabled = false
tree_max_level = 3
tree_cluster_size = 5
tree_min_chunks = 12

# SearXNG behind the web source of search_live (just search). base_url is per-machine and lives in .env.
[search]
engines = "google,brave,bing"
language = "en-US"
safesearch = 1                     # 0 off, 1 moderate, 2 strict
max_results = 8
snippet_chars = 300

[firecrawl]
timeout_ms = 60000
wait_for_ms = 5000             # wait after load for ASU pages to fill in content
only_main_content = true

# endpoint and keys are per-machine and live in .env.
[object_store]
bucket = "sparky"
region = "us-east-1"

# ---------------------------------------------------------------- the developer console
[cli]
phoenix_url = "http://localhost:6006"
log_lines = 5000
log_dir = ".sparky/logs"
health_interval_secs = 5
port_check_ms = 150

# ---------------------------------------------------------------- training and evals
# engine_url and engine_service_token are per-machine and live in .env. The export reads
# telemetry.phoenix_url and telemetry.project_name.
[training]
state_dir = "../../.sparky"
cases_dir = "evals/cases"
baseline_path = "evals/baseline.json"
request_timeout_secs = 180.0
phoenix_page_spans = 1000        # Phoenix serves at most 1000 spans a page
