# SparkyAI settings. Committed, reviewed, and read by every app.
#
# Two layers, lowest first: this file, then SPARKY_<SECTION>__<KEY> environment variables,
# which win. Secrets, per-machine URLs and the values docker compose overrides live in .env.
# Anything tunable lives here.
#
# Read by apps/engine, apps/discord and apps/cli (Rust, figment) and by apps/scraper and
# apps/training (Python, tomllib through pydantic-settings). Point elsewhere with
# SPARKY_CONFIG_FILE.

[app]
log_level = "info,sparky=debug"

# ---------------------------------------------------------------- the agent loop
[agent]
max_steps = 8
max_model_retries = 2
request_timeout_secs = 90
tool_timeout_secs = 20
confirmation_ttl_secs = 600
model_slots = 2                # match llama-server --parallel
model_queue_wait_secs = 30
temperature = 0.3
history_turns = 20
memory_recall_limit = 10
# Recall memory and the profile graph where others can read the answer.
recall_in_public = false

# Prompt budgets in estimated tokens. A section budget above the total is rejected at boot.
# chars_per_token is what makes an estimate an estimate. Lower it for a tokenizer that splits
# URLs and course codes finely.
prompt_budget_tokens = 3000
evidence_budget_tokens = 1200
history_budget_tokens = 1000
memory_budget_tokens = 300
capabilities_budget_tokens = 600
chars_per_token = 4

retry_base_ms = 250
retry_cap_ms = 8000
max_span_value_chars = 32000
# Characters of a thought, of the arguments, and of the result that one live progress line
# carries to whoever is watching the turn.
progress_detail_chars = 160

# ---------------------------------------------------------------- what the model is told
# Changing any of this changes the prompt hash. system_file beats system, which beats the
# built-in default.
[prompt]
# system_file = "prompts/sparky.md"
role_line = "The user is `{user}`. Roles: {roles}."
role_line_no_roles = "The user is `{user}`. They hold no special roles."
memory_header = "What you remember about this user:"
evidence_header = "Knowledge base results for this question, closest match first. These were retrieved for you before you were called. Answer from them and from tool output only, and cite the bracketed number of every entry you use."
no_evidence_line = "The knowledge base returned nothing for this question. Search it with a tool before you answer, or say you do not have it."
capabilities_header = "What you can do. Each line is a name, how it runs, and what it does."
# {date} is filled in at assembly. Evidence rows carry a day or date label; without today's
# date the model cannot tell which one a question means.
date_line = "Today is {date}. Evidence rows are labelled by day or date; read the label the question asks for, never the first value in a row."
utc_offset_hours = -7          # Arizona, which keeps -7 all year

# ---------------------------------------------------------------- the model
# base_url and api_key are per-machine and live in .env.
[model]
name = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
# Reasoning comes out of the same budget as the answer, so thinking needs room for both. The
# slot has to hold the prompt and this: chat ctx-size 16384 over --parallel 2 is 8192 a slot.
max_tokens = 4096
# Qwen3 reasons before it answers. llama-server returns that reasoning in reasoning_content,
# the harness shows it as the live thinking line, and it never reaches the answer.
thinking = true
usd_per_m_prompt = 0.0
usd_per_m_completion = 0.0

# Only what is set is sent. The server defaults apply to the rest.
[model.sampling]
# top_p = 0.9
# top_k = 40
# min_p = 0.05
# repeat_penalty = 1.05
# seed = 42

# base_url and api_key are per-machine and live in .env.
[embedding]
name = "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0"
dim = 1024
batch_size = 32                # apps/scraper only

# The model that writes a tree node summary. base_url and api_key are per-machine and live
# in .env.
[summary]
name = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
max_tokens = 512
temperature = 0.2
timeout_secs = 120
thinking = false               # reasoning spends the whole budget and returns empty content

# ---------------------------------------------------------------- retrieval
# Two legs fused with reciprocal rank fusion. Turning both off is rejected at boot.
[retrieval]
top_k = 6                      # evidence chunks handed to the prompt
candidates = 20                # pulled from each leg before fusion
rrf_k = 60.0
text_search_config = "english"
dense = true
lexical = true
min_score = 0.0

# ---------------------------------------------------------------- what may run
# Risk classes in order: read_public, read_authenticated, prepare_write, external_write,
# destructive, forbidden.
[policy]
write_roles = ["MANAGE_GUILD"]
allow_authenticated_reads = false
confirm_from = "external_write"

[tools]
disabled = []
knowledge_search = true
query_source = true

# The classifier and the graph agent. Detached from the request that produced the turn.
# Off until the graph is wanted; every turn otherwise costs two extra model calls.
[profile]
enabled = true
max_tokens = 512
timeout_secs = 60
# Withdraw a recorded fact when a new one makes it false. Costs a model call only when a new
# fact collides with one already recorded for the same subject and relation.
reconcile = true
min_confidence = 0.5           # extracted facts below this, or with an empty label, are dropped
list_limit = 50               # nodes and relations POST /profile/list returns, each
request_timeout_secs = 30      # budget for one /profile/list or /profile/forget call

# The gate on extraction. It runs on every turn, so it is rules rather than a model call.
# Empty lists use the built-in ones. A turn passes when a first-person marker sits next to a
# cue and it is not a question.
[profile.detector]
subjects = []
cues = []
min_words = 4

# A command in an isolated environment. The engine needs access to the container runtime.
# No network, read-only root, dropped capabilities, non-root user.
[sandbox]
enabled = true
runtime = "docker"
image = "alpine:3.20"
memory = "256m"
cpus = "1"
pids = 128
timeout_secs = 20
max_output_chars = 4000
risk = "prepare_write"
session_idle_secs = 900        # how long a named session stays up with nothing running

# The gate every model response passes, on the capability branch and the answer branch.
[guardrail]
enabled = true
denied_phrases = []
max_answer_chars = 8000
replacement = "I cannot answer that. Ask a moderator if you need help."

# The chat agent. Replaces the turns that no longer fit with one turn that does. Off leaves
# history trimmed by dropping the oldest turns.
[compaction]
enabled = true
max_tokens = 512
temperature = 0.0
timeout_secs = 30
# instructions = "You compact a conversation..."

# Live source queries need just worker. Without it every query times out.
[query]
timeout_secs = 90
poll_ms = 400

# ---------------------------------------------------------------- MCP
# Servers go in [[mcp.servers]], which the environment cannot express. None is configured.
[mcp]
required_props_only = true
max_output_chars = 6000
max_schema_description_chars = 80
max_tool_description_chars = 160

# [[mcp.servers]]
# name = "example"
# url = "http://localhost:9000/mcp"
# tools = []
# required_props_only = true
# tool_timeout_secs = 45

# ---------------------------------------------------------------- traces
[trace]
enabled = true
dir = ".sparky/traces"
max_file_bytes = 0             # 0 removes the limit
retention_hours = 0            # 0 keeps them forever

# Spans go to PostHog over OTLP/HTTP at traces_path, and to Phoenix at phoenix_url plus
# /v1/traces. host and phoenix_url are per-machine and project_token is a secret; all three live
# in .env. Each destination is independent: an empty project_token turns PostHog off, an empty
# phoenix_url turns Phoenix off. Set SPARKY_TELEMETRY__PHOENIX_URL=http://localhost:6006 with
# just phoenix running to read a conversation as a trace tree.
# ai_path is off: the self-hosted capture-ai service answers /i/v0/ai/otel with "request missing
# data payload" because it takes PostHog's own event payload rather than OTLP, so every batch
# sent there fails. Set it to /i/v0/ai/otel against PostHog Cloud, which does take OTLP.
[telemetry]
sample_ratio = 1.0
export_timeout_secs = 10
traces_path = "/i/v1/traces"
ai_path = ""
provider_name = "llama.cpp"

# Discord product events to PostHog, through the telemetry host and project token.
[analytics]
enabled = true
queue_capacity = 1024
max_batch = 100
flush_ms = 2000

# ---------------------------------------------------------------- the HTTP surface
[http]
max_body_bytes = 1048576
concurrency_limit = 0          # 0 removes the limit
rate_limit_per_min = 0         # per user, 0 removes the limit
cors_origins = []              # ["*"] for the Vite dev server
shutdown_grace_secs = 10

# ---------------------------------------------------------------- the Discord bot
[bot]
channels = []                  # empty answers in every channel it can see
max_message_chars = 2000       # the Discord hard limit
edit_every_ms = 1500
cooldown_secs = 0
write_capability = "MANAGE_GUILD"
thread_auto_archive_minutes = 1440   # 60, 1440, 4320, or 10080; threads the bot opens for answers

# ---------------------------------------------------------------- postgres
# url carries the password and lives in .env.
[postgres]
max_connections = 10
acquire_timeout_secs = 5

# ---------------------------------------------------------------- the scraper
[scraper]
tenant_id = "public"           # public ASU content, readable by every guild
fetcher = "firecrawl"          # firecrawl renders JS and returns markdown; http is plain httpx
user_agent = "SparkyAI/2.0 (+https://github.com/ashworks1706/SparkyAI)"
request_timeout_secs = 30.0
chunk_chars = 1200
chunk_overlap_chars = 200
query_max_chars = 12000
parser_version = "bs4-text-v1"
# A fetch yielding less than this fraction of the last good run is refused. Pages churn by
# single digits between runs; an extractor break returns a nav shell.
quality_floor_ratio = 0.5
quality_floor_min_chars = 500     # below this, ordinary variation crosses any ratio
# A RAPTOR style tree over the chunks of one source. Off by default: it costs a model call per
# cluster per level. Retrieval searches every level at once, so a query finds the granularity
# that fits it.
tree_enabled = false
tree_max_level = 3
tree_cluster_size = 5
tree_min_chunks = 12

# base_url is per-machine and lives in .env.
[firecrawl]
timeout_ms = 60000
wait_for_ms = 5000             # ASU pages fill in content after load
only_main_content = true

# endpoint and keys are per-machine and live in .env.
[object_store]
bucket = "sparky"
region = "us-east-1"

# ---------------------------------------------------------------- the developer console
[cli]
posthog_url = "http://localhost:8010"
log_lines = 5000
log_dir = ".sparky/logs"
health_interval_secs = 5
port_check_ms = 150

# ---------------------------------------------------------------- training and evals
# engine_url, engine_service_token, posthog_host, posthog_project_id and posthog_api_key are
# per-machine and live in .env.
[training]
state_dir = "../../.sparky"
cases_dir = "evals/cases"
baseline_path = "evals/baseline.json"
request_timeout_secs = 180.0
posthog_page_rows = 5000
