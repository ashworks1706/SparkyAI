# Copy to sparky.toml. Every value here is the default, so an empty file behaves identically.
#
# Layering: this file loads first, then SPARKY_* environment variables, which win. Secrets
# belong in .env; lists and nested tables belong here, because the environment cannot carry
# a list of tables. sparky.toml is gitignored; this example is not.
#
# Point elsewhere with SPARKY_CONFIG_FILE=/path/to/config.toml. A missing file is not an error.

# ---------------------------------------------------------------- the agent loop
[agent]
max_steps = 8                  # model calls per request
max_model_retries = 2          # retries per model call on transport or 5xx errors
request_timeout_secs = 90      # wall-clock budget per request
tool_timeout_secs = 20         # per tool call, unless the tool declares its own
confirmation_ttl_secs = 600    # how long a held action waits for approval
model_slots = 2                # match `llama-server --parallel`; 0 removes the limit
model_queue_wait_secs = 30     # wait for a free slot before reporting the model busy
temperature = 0.3
history_turns = 20             # prior turns loaded from the conversation
memory_recall_limit = 10       # memories recalled per request

# Prompt budgets, in estimated tokens. Every section budget must fit inside the total, and
# `chars_per_token` is what makes an estimate an estimate: lower it for a tokenizer that
# splits URLs and ASU jargon finely, or the window silently overfills.
prompt_budget_tokens = 3000
evidence_budget_tokens = 1200
history_budget_tokens = 1000
memory_budget_tokens = 300
chars_per_token = 4

retry_base_ms = 250            # first retry wait, doubled per attempt
retry_cap_ms = 8000
max_span_value_chars = 32000   # the JSONL trace keeps whatever a span drops

# ---------------------------------------------------------------- what the model is told
# Changing any of this changes the prompt hash, so a trace says which wording produced an
# answer. `system_file` beats `system`, which beats the built-in default.
[prompt]
# system_file = "prompts/sparky.md"
# system = "You are Sparky…"
role_line = "The user is `{user}`. Roles: {roles}."
role_line_no_roles = "The user is `{user}`. They hold no special roles."
memory_header = "What you remember about this user:"
evidence_header = "Evidence from ASU sources. Answer only from this; cite sources by number. If it does not answer the question, say so."

# ---------------------------------------------------------------- the model endpoint
# base_url, api_key, name and max_tokens live in .env. Sampling belongs here.
[model.sampling]
# Only what is set is sent, so the server's own defaults apply to the rest.
# top_p = 0.9
# top_k = 40
# min_p = 0.05
# repeat_penalty = 1.05
# presence_penalty = 0.0
# frequency_penalty = 0.0
# seed = 42                    # fixes sampling, so an eval run reproduces
# stop = ["</answer>"]

# ---------------------------------------------------------------- retrieval
# Two legs, fused with reciprocal rank fusion. Turning both off is rejected at boot.
[retrieval]
top_k = 6                      # evidence chunks handed to the prompt
candidates = 20                # pulled from each leg before fusion; raise for recall
rrf_k = 60.0                   # lower trusts the top of each list more
text_search_config = "english" # a Postgres text search configuration
dense = true                   # the pgvector leg
lexical = true                 # the full-text leg
min_score = 0.0                # drop fused results below this; 0 keeps everything

# ---------------------------------------------------------------- what may run
[policy]
write_roles = ["MANAGE_GUILD"]     # may run external_write and above; empty denies everyone
allow_authenticated_reads = false  # opens reads inside the user's own session
confirm_from = "external_write"    # lowest risk class held for approval; see below

# Risk classes, in order:
#   read_public < read_authenticated < prepare_write < external_write < destructive < forbidden
# Lower `confirm_from` to hold drafts too while a new tool is being trusted.

[tools]
disabled = []                  # names never registered, whatever their source
knowledge_search = true        # the built-in retrieval tool, `search_knowledge_base`
query_source = true            # live parameterized queries; off if no worker will run
query_timeout_secs = 90        # end to end, overriding agent.tool_timeout_secs
query_poll_ms = 400            # how often the engine checks whether the worker answered

# ---------------------------------------------------------------- MCP servers
# The environment cannot carry a list of tables, so servers live here. `mcp.playwright_url`
# in .env still works and is folded in as a server named `playwright`.
[mcp]
required_props_only = true          # show the model only each tool's required properties
max_output_chars = 6000             # longest tool result handed back
max_schema_description_chars = 80   # schemas cost context on every step
max_tool_description_chars = 160

# [[mcp.servers]]
# name = "playwright"
# url = "http://localhost:8931/mcp"
# tools = [                          # empty exposes every tool the server lists
#   "browser_navigate",
#   "browser_navigate_back",
#   "browser_snapshot",
#   "browser_click",
#   "browser_type",
#   "browser_press_key",
# ]
# required_props_only = true         # overrides [mcp]
# tool_timeout_secs = 45             # overrides agent.tool_timeout_secs for this server

# ---------------------------------------------------------------- traces
[trace]
enabled = true
dir = ".sparky/traces"
max_file_bytes = 0             # cap one request's trace; 0 removes the limit
retention_hours = 0            # delete older traces at boot; 0 keeps them forever

[telemetry]
otlp_endpoint = "http://localhost:4317"   # empty disables export
sample_ratio = 1.0                        # whole traces, not individual spans
export_timeout_secs = 10
# service_name = "engine"
# span_target_prefix = "engine"           # keeps dependency spans out of Phoenix

# ---------------------------------------------------------------- the HTTP surface
[http]
max_body_bytes = 1048576       # 1 MiB
concurrency_limit = 0          # requests at once; 0 removes the limit
rate_limit_per_min = 0         # per user; 0 removes the limit
cors_origins = []              # ["*"] for the Vite dev server; empty adds no CORS headers
shutdown_grace_secs = 10       # in-flight requests get this long after a signal

# ---------------------------------------------------------------- the Discord bot
[bot]
channels = []                  # channel ids the bot answers in; empty means everywhere
max_message_chars = 2000       # Discord's own hard limit; may go below, never above
edit_every_ms = 1500           # gap between progress edits; Discord throttles faster
cooldown_secs = 0              # per user, between questions; 0 removes the limit
write_capability = "MANAGE_GUILD"   # must match policy.write_roles on the engine
